<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Recomp 45</title>
<meta name="description" content="Plan de recomposición corporal de 12 semanas.">
<meta name="theme-color" content="#14171b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recomp 45">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: consola de taller en una columna para el móvil. Cabecera con semana y fecha, pestañas abajo,
   paneles con franja amarilla para IA, ajustes y copias. Mismo lenguaje visual que Taller 7L: un solo tema oscuro. */
:root{
  --bg:#0b0d10; --surface:#14171b; --surface-2:#1c2026; --well:#0c0e11; --ink:#e8ecf0; --muted:#8d97a2; --line:#2a3037;
  --accent:#f39a1e; --accent-2:#e2861a; --accent-ink:#1a1003; --accent-soft:#f39a1e24;
  --band:#f2c230; --band-ink:#1b1606;
  --p:#5aa2e6; --c:#e0b84a; --f:#a8bb64;
  --good:#2fc48d; --good-soft:#2fc48d1f; --warn:#f2c230; --warn-soft:#f2c2301f; --bad:#e8452c; --bad-soft:#e8452c24;
  --bevel:inset 0 1px 0 #ffffff12, inset 0 -1px 0 #00000080;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font:15px/1.45 var(--f-body);-webkit-text-size-adjust:100%;min-height:100vh;
  background:radial-gradient(1100px 520px at 55% -8%,#1b1f25 0%,transparent 70%),var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ===== cabecera ===== */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:linear-gradient(180deg,#1b1e23,#111316);border-bottom:1px solid #000;box-shadow:0 1px 0 #ffffff0a,0 6px 18px #0009}
.tape{height:5px;background:repeating-linear-gradient(-45deg,var(--accent) 0 10px,#111316 10px 20px)}
.top-in{max-width:640px;margin:0 auto;padding-block:10px 8px;display:grid;gap:8px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:1.5rem;letter-spacing:.03em;text-transform:uppercase;line-height:1;color:#f3f5f7;text-shadow:0 1px 0 #000}
.brand h1 span{color:var(--accent)}
.brand small{display:block;font-family:var(--f-mono);font-weight:400;font-size:.68rem;letter-spacing:.04em;color:var(--muted);margin-top:3px;text-transform:none;text-shadow:none}
.brand .acts{margin-left:auto;display:flex;gap:6px}
.hbtn{background:linear-gradient(180deg,#2c3138,#1a1e23);border:1px solid #3b424b;color:#e9edf1;box-shadow:var(--bevel),0 2px 6px #0008;font-family:var(--f-display);font-weight:600;font-size:.95rem;letter-spacing:.07em;text-transform:uppercase;padding:7px 12px;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.hbtn.pri{background:linear-gradient(180deg,#f8b04c,var(--accent-2));border-color:#f9b75a;color:var(--accent-ink);box-shadow:inset 0 1px 0 #fff5,0 2px 10px #f39a1e40}
.datenav{display:flex;align-items:center;gap:6px}
.datenav .lbl{flex:1;text-align:center;font-family:var(--f-display);font-weight:600;font-size:1.05rem;letter-spacing:.05em;text-transform:uppercase}
.datenav button{background:var(--well);border:1px solid #2b3138;box-shadow:inset 0 1px 3px #000c;border-radius:4px;min-width:40px;height:34px;padding:0 10px;color:var(--ink)}
.datenav button.today{font-family:var(--f-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.85rem;color:var(--accent)}
.status{font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:6px;font-family:var(--f-mono)}
.status i{width:7px;height:7px;transform:rotate(45deg);background:var(--muted);display:inline-block}
.status.ok i{background:var(--good);box-shadow:0 0 6px var(--good)} .status.err i{background:var(--bad)} .status.wait i{background:var(--warn)}
.mpanel{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(100% + 4px);z-index:60;min-width:250px;background:linear-gradient(180deg,#1b1e23,#121417);border:1px solid #000;border-radius:5px;box-shadow:var(--bevel),0 14px 34px #000d;padding:6px;display:flex;flex-direction:column;gap:2px;animation:popIn .16s cubic-bezier(.2,.8,.2,1)}
.mi{all:unset;box-sizing:border-box;display:flex;flex-direction:column;padding:9px 12px;border-radius:3px;cursor:pointer;color:#dfe4e9;font-size:.92rem}
.mi small{color:var(--muted);font-size:.75rem}
.mi:hover,.mi:focus-visible{background:#ffffff0f;color:#fff}
.msep{height:1px;background:#000;box-shadow:0 1px 0 #ffffff0a;margin:4px 2px}

/* ===== contenido ===== */
main{max-width:640px;margin:0 auto;padding-block:14px calc(100px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.card{background:linear-gradient(180deg,#171a1f,#121417);border:1px solid #23282e;border-radius:6px;box-shadow:var(--bevel);padding:14px;display:grid;gap:10px;min-width:0}
h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:1.05rem;letter-spacing:.12em;text-transform:uppercase;color:#cfd6dd;display:flex;align-items:center;gap:9px;line-height:1.15}
h2::before{content:"";width:7px;height:7px;background:var(--accent);transform:rotate(45deg);box-shadow:0 0 8px #f39a1e88;flex:none}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#3a414a,transparent)}
h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:1.2rem;letter-spacing:.02em;line-height:1.15;color:#f3f5f7;text-wrap:balance}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.big-title{font-family:var(--f-display);font-weight:700;font-size:1.6rem;letter-spacing:.02em;text-transform:uppercase;line-height:1.05;color:#f3f5f7}
.muted{color:var(--muted)} .small{font-size:.86rem}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap} .between{justify-content:space-between} .grow{flex:1;min-width:0}
p{margin:0}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:600;font-size:.9rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.chip.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn{border:1px solid #3b424b;background:linear-gradient(180deg,#2c3138,#1a1e23);color:#e9edf1;border-radius:4px;box-shadow:var(--bevel),0 2px 6px #0008;font-family:var(--f-display);font-weight:600;font-size:1rem;letter-spacing:.07em;text-transform:uppercase;padding:9px 14px;transition:transform .08s,border-color .15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(180deg,#f8b04c,var(--accent-2));border-color:#f9b75a;color:var(--accent-ink);box-shadow:inset 0 1px 0 #fff5,0 2px 10px #f39a1e40}
.btn.sm{padding:5px 10px;font-size:.88rem}
.btn:disabled{opacity:.45}
.x{border:none;background:none;color:var(--muted);font-size:1.25rem;padding:0 6px}
input[type=number],input[type=text],input[type=password],select,textarea{width:100%;min-width:0;background:var(--well);border:1px solid #2b3138;border-radius:3px;box-shadow:inset 0 1px 3px #000c;padding:8px 10px;font-size:16px;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:inset 0 1px 3px #000c,0 0 0 2px #f39a1e33}
input[type=number]{font-family:var(--f-mono)}
input[type=range]{width:100%;accent-color:var(--accent)}
details summary{cursor:pointer;font-weight:600}
a{color:var(--accent)}

/* energía */
.energy{display:grid;grid-template-columns:124px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:124px;height:124px}
.ring svg{width:124px;height:124px;transform:rotate(-90deg)}
.ring .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .big{font-family:var(--f-display);font-weight:700;font-size:2rem;line-height:1;color:#f3f5f7}
.ring .sub{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.bars{display:grid;gap:9px;min-width:0}
.bar .lab{display:flex;justify-content:space-between;font-size:.84rem;gap:6px}
.bar .lab .num{white-space:nowrap}
.track{height:7px;border-radius:3px;background:#07080a;border:1px solid #23282e;box-shadow:inset 0 1px 2px #000;overflow:hidden}
.fill{height:100%;transition:width .3s}
@media (max-width:360px){.energy{grid-template-columns:1fr;justify-items:center}.bars{width:100%}}

/* fase */
.phase{display:grid;gap:3px;border-left:4px solid var(--band);padding:10px 12px;background:linear-gradient(90deg,#f2c23014,transparent);border-radius:0 6px 6px 0}
.phase b{font-family:var(--f-display);font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;color:var(--band)}

/* hábitos */
.habits{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.habit{border:1px solid #23282e;background:#101215;border-radius:4px;padding:10px;display:grid;gap:6px;min-width:0}
.habit label,.field label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.habit .goal{font-size:.74rem;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:4px;border:1px solid #3b424b;background:linear-gradient(180deg,#2c3138,#1a1e23);box-shadow:var(--bevel);font-weight:700;font-size:1.1rem}
.stepper .v{flex:1;text-align:center;font-family:var(--f-mono)}
.toggle{display:flex;align-items:center;gap:10px;border:1px solid #23282e;border-radius:4px;padding:10px 12px;background:#101215;text-align:left;width:100%;color:var(--ink)}
.toggle .box{width:22px;height:22px;border-radius:3px;border:2px solid #4a525b;display:grid;place-items:center;flex:none;font-weight:700}
.toggle[aria-pressed=true]{border-color:var(--good)}
.toggle[aria-pressed=true] .box{background:var(--good);border-color:var(--good);color:#05140d}
.toggle .t{font-weight:600} .toggle .d{font-size:.8rem;color:var(--muted)}
@media (max-width:360px){.habits{grid-template-columns:1fr}}

/* comidas */
.meal{border-left:4px solid var(--st,#3a4048)}
.meal.done{--st:var(--good)}
.meal-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.done-btn{border:1px solid #3b424b;background:linear-gradient(180deg,#2c3138,#1a1e23);box-shadow:var(--bevel);border-radius:3px;padding:6px 10px;font-family:var(--f-display);font-weight:600;font-size:.9rem;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.done-btn[aria-pressed=true]{background:var(--good);border-color:var(--good);color:#05140d}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--well);border:1px solid #000;border-radius:5px;box-shadow:inset 0 1px 3px #000c;padding:3px;gap:3px}
.seg button{border:0;border-radius:3px;background:none;color:#aeb6bf;padding:6px 6px;font-size:.78rem;line-height:1.2;text-align:left;min-width:0}
.seg button b{display:block;font-family:var(--f-display);font-size:.9rem;letter-spacing:.06em;text-transform:uppercase}
.seg button[aria-pressed=true]{background:linear-gradient(180deg,#f8b04c,var(--accent-2));color:var(--accent-ink);box-shadow:inset 0 1px 0 #fff5}
.items{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.items li{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;border-bottom:1px dashed #2a3037;padding-bottom:4px}
.items li>span:last-child{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);white-space:nowrap}
.macroline{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--f-mono);font-size:.8rem}
.pP{color:var(--p)} .pC{color:var(--c)} .pF{color:var(--f)}
.extra-form{display:grid;grid-template-columns:1fr 90px;gap:8px}
.manual{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ai-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* entreno */
.ex-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.ex-meta{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.note{font-size:.85rem;color:var(--muted);padding:6px 10px;border-left:3px solid #3a4048;background:#101215}
.note.elbow{border-left-color:var(--band)}
.pill{display:inline-block;font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;font-weight:700;padding:3px 8px;border-radius:2px;background:#3a4048;color:#e5e9ed}
.pill.up{background:var(--good);color:#05140d} .pill.hold{background:var(--band);color:var(--band-ink)}
.sets{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 8px;align-items:center}
.sets .h{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}
.sets .n{font-family:var(--f-mono);font-size:.82rem;color:var(--accent);width:26px}
.sets input{padding:7px 8px;text-align:center}
.restbtn{border:1px solid #3b424b;background:linear-gradient(180deg,#2c3138,#1a1e23);box-shadow:var(--bevel);border-radius:3px;padding:6px 9px;font-family:var(--f-mono);font-size:.82rem;white-space:nowrap}
.timer{position:fixed;left:0;right:0;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:35;display:flex;justify-content:center}
.timer-in{background:#14171bf2;border:1px solid #2a3037;border-left:4px solid var(--accent);border-radius:4px;padding:10px 14px;display:flex;gap:14px;align-items:center;max-width:640px;width:100%;box-shadow:0 10px 24px #000a}
.timer-in .t{font-family:var(--f-mono);font-size:1.6rem;color:var(--accent)}
.timer-in button{margin-left:auto}

/* progreso */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:#101215;border:1px solid #23282e;border-radius:4px;box-shadow:var(--bevel);padding:10px 12px;display:grid;gap:2px;min-width:0}
.kpi .v{font-family:var(--f-display);font-weight:700;font-size:1.7rem;line-height:1.05;color:var(--accent)}
.kpi .v small{font-size:.9rem;color:var(--muted)}
.kpi .d{font-size:.76rem;color:var(--muted)}
.d.good{color:var(--good)} .d.bad{color:var(--bad)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.advice{border-radius:4px;padding:12px;display:grid;gap:4px;border-left:4px solid var(--muted);background:#101215}
.advice.good{border-left-color:var(--good);background:var(--good-soft)} .advice.warn{border-left-color:var(--band);background:var(--warn-soft)}
.advice b{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.06em;font-size:1.05rem}
.empty{border:1px dashed #3a4048;border-radius:4px;padding:16px;text-align:center;color:var(--muted);font-size:.9rem}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{display:grid;gap:4px;min-width:0}

/* plan */
.plan p,.plan li{max-width:65ch}
.plan ul,.plan ol{margin:0;padding-left:1.2em;display:grid;gap:6px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #23282e;vertical-align:top}
th{font-family:var(--f-display);text-transform:uppercase;letter-spacing:.08em;font-size:.8rem;color:var(--muted);font-weight:600}
td.num{white-space:nowrap}
.light{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:start;font-size:.9rem}
.dot{width:12px;height:12px;transform:rotate(45deg);margin-top:5px}

/* pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:linear-gradient(180deg,#16191d,#101215);border-top:1px solid #000;box-shadow:0 -1px 0 #ffffff0a;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{border:none;background:none;padding:8px 2px 9px;display:grid;justify-items:center;gap:3px;color:#7f8994;font-family:var(--f-display);font-weight:600;font-size:.82rem;letter-spacing:.07em;text-transform:uppercase;border-top:3px solid transparent}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current=page]{color:#fff;border-top-color:var(--accent);text-shadow:0 0 10px #f39a1e66}

/* paneles con franja (IA, ajustes, copias) */
.sheet{position:fixed;inset:0;z-index:70;background:#000a;display:flex;align-items:flex-end;justify-content:center;padding-top:calc(env(safe-area-inset-top,0px) + 24px)}
.ovl{width:100%;max-width:640px;max-height:100%;display:flex;flex-direction:column;background:var(--surface);border-radius:8px 8px 0 0;overflow:hidden;box-shadow:0 -10px 40px #000b;animation:upIn .22s cubic-bezier(.2,.8,.2,1)}
.ovl-head{display:flex;align-items:center;gap:12px;background:var(--band);color:var(--band-ink);padding:9px 12px 9px 16px}
.ovl-head .k{font-family:var(--f-display);font-weight:700;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;opacity:.75}
.ovl-head strong{font-family:var(--f-display);font-weight:700;font-size:1.25rem;letter-spacing:.02em;line-height:1.1;flex:1;min-width:0;text-transform:uppercase}
.ovl-head button{border:0;background:none;color:inherit;font-size:1.6rem;line-height:1;padding:0 4px}
.ovl-body{padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto;display:flex;flex-direction:column;gap:12px}
.chat{display:flex;flex-direction:column;gap:10px;min-height:120px}
.msg{max-width:88%;padding:9px 12px;border-radius:6px;font-size:.93rem;white-space:normal;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent-soft);border:1px solid #f39a1e55}
.msg.a{align-self:flex-start;background:#101215;border:1px solid #23282e;border-left:3px solid var(--accent)}
.msg.a ul{margin:4px 0;padding-left:1.1em}
.msg.err{border-left-color:var(--bad)}
.msg img{max-width:160px;border-radius:4px;display:block;margin-bottom:6px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid #3b424b;background:linear-gradient(180deg,#262b31,#1a1e23);box-shadow:var(--bevel);border-radius:999px;padding:5px 11px;font-size:.8rem;color:#e3e8ec}
.composer{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:end;position:sticky;bottom:0;background:var(--surface);padding-top:6px}
.composer textarea{resize:none;min-height:42px;max-height:120px}
.att{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.att img{width:48px;height:48px;object-fit:cover;border-radius:3px;border:1px solid var(--line)}
.preview{max-width:100%;max-height:220px;object-fit:contain;border-radius:4px;border:1px solid var(--line);align-self:center}
.ai-item{display:grid;grid-template-columns:1fr 78px;gap:8px;align-items:center;border-bottom:1px dashed #2a3037;padding-bottom:6px}
.ai-item .m{grid-column:1/-1;font-family:var(--f-mono);font-size:.78rem;color:var(--muted)}

/* avisos */
.toasts{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 16px}

.toast.err{border-left-color:var(--bad)}
.toast button{border:1px solid var(--accent);background:none;color:var(--accent);border-radius:3px;padding:3px 8px;font-family:var(--f-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase}

/* acceso */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px max(16px,env(safe-area-inset-left,0px))}
.gate-in{max-width:420px;width:100%;display:grid;gap:16px;text-align:center;justify-items:center}
.lmark{width:58px;height:58px;border:2px solid var(--accent);transform:rotate(45deg);display:grid;place-items:center;box-shadow:0 0 24px #f39a1e55}
.lmark span{transform:rotate(-45deg);font-family:var(--f-display);font-weight:700;font-size:1.3rem;color:var(--accent)}
.gate h1{margin:0;font-family:var(--f-display);font-size:2rem;letter-spacing:.1em;text-transform:uppercase}
.gate ol{text-align:left;font-size:.9rem;display:grid;gap:6px;padding-left:1.2em;margin:0}

@keyframes popIn{from{opacity:0;transform:translateY(-6px) scale(.98)}to{opacity:1;transform:none}}
@keyframes upIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes toastIn{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const todayISO=()=>iso(new Date());
const fmt=(n,dec=0)=>Number(n).toLocaleString('es-ES',{minimumFractionDigits:dec,maximumFractionDigits:dec});

const MON=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const shortDate=s=>{const d=parse(s);return `${d.getDate()} ${MON[d.getMonth()]}`};
const longDate=s=>{const d=parse(s);return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`};
const mondayOf=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};

  if(w===7) return {n:'Descarga',rir:'3-4',deload:true,t:'Semana de descarga: solo 2 series por ejercicio con el mismo peso. Tendones y articulaciones se recuperan y vuelves más fuerte.'};
  if(w<=11) return {n:'Intensificación',rir:'1-2',t:'Deja 1-2 en reserva en los ejercicios principales. Nunca al fallo en los que cargan el codo.'};
  if(w===12) return {n:'Evaluación',rir:'2',t:'Última semana: repite las cargas de la semana 11, mide cintura, haz fotos y compara con la semana 1.'};
  return {n:'Plan completado',rir:'2',t:'Has terminado las 12 semanas. Sigue registrando y preparamos el siguiente bloque.'};
}
function itemM(fid,g){const F=FOODS[fid];if(!F)return{k:0,p:0,c:0,f:0};const m=g/100;return{k:F.k*m,p:F.p*m,c:F.c*m,f:F.f*m}}
function sumM(list){return list.reduce((a,b)=>({k:a.k+b.k,p:a.p+b.p,c:a.c+b.c,f:a.f+b.f}),{k:0,p:0,c:0,f:0})}
function optM(o){return sumM(o.items.map(([id,g])=>itemM(id,g)))}
function qty(fid,g){const F=FOODS[fid];if(F.u){const n=g/F.u[0];if(Math.abs(n-Math.round(n))<.01){const r=Math.round(n);return `${r} ${r===1?F.u[1]:F.u[2]} (${g} g)`}}return `${fmt(g)} ${F.ml?'ml':'g'}`}

const S={days:{},workouts:{},checkins:{}};
const COLS=['days','workouts','checkins'];
let uid=null,pendingRender=false,unsubs=[],firstLoad={},seeded=false;
const dirty={},timers={};
const path=col=>`users/${uid}/${col}`;
function setStatus(kind,text){const el=$('#status');el.className='status '+kind;el.querySelector('span').textContent=text}
function saveDoc(col,id,data){
  S[col][id]=data;const k=col+'/'+id;dirty[k]=true;
  clearTimeout(timers[k]);
  timers[k]=setTimeout(()=>{window.FB.db.set(path(col),id,clone(S[col][id]));setTimeout(()=>{delete dirty[k]},2500)},500);
}
function startData(){
  unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];
  const state={};
  for(const col of COLS){
    unsubs.push(window.FB.db.watch(path(col),snap=>{
      const o={};snap.docs.forEach(d=>{o[d.id]=d.data});
      for(const k of Object.keys(dirty)){const [c,id]=k.split('/');if(c===col&&S[col][id])o[id]=S[col][id]}
      S[col]=o;state[col]=snap;
      if(!snap.fromCache)firstLoad[col]=true;
      const all=COLS.map(c=>state[c]).filter(Boolean);
      if(all.length===COLS.length){
        if(all.some(s=>s.fromCache))setStatus('wait','Sin conexión · lo que apuntes se sube al volver');
        else if(all.some(s=>s.pending))setStatus('wait','Guardando…');
        else setStatus('ok','Sincronizado con tu cuenta');
      }
      maybeSeed();requestRender();
    }));
  }
}
function maybeSeed(){
  if(!COLS.every(c=>firstLoad[c]))return;
  applyZeppSync();
  if(seeded)return;
  seeded=true;
  if(!Object.keys(S.days).length&&!Object.keys(S.checkins).length){
    saveDoc('days',START,{meals:{},extras:[],weight:BASE.peso});
    saveDoc('checkins',START,{waist:BASE.cintura,note:'Punto de partida: 80 kg, 96 cm, ~21% grasa'});
  }
}

/* ===== Zepp (vía Salud de Apple y el Atajo «Recomp Zepp») =====
   El Atajo abre ...?zepp=1&fecha=DD-MM-AAAA&pasos=N&kcal=N[&sueno=H]
   La fecha vale como día-mes-año (03-11-2026, 03/11/2026, 03-nov-2026) o año-mes-día; si falta, es hoy.
   Los datos se guardan aquí y se aplican al día cuando ya se han cargado tus datos, para no pisar nada. */
const ZKEY='recomp45-zepp-pending',SHORTCUT='Recomp Zepp';
function parseFecha(s){
  if(!s)return null;s=String(s).trim().toLowerCase().replace(/\./g,'');
  const MESES={ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sep:9,sept:9,set:9,oct:10,nov:11,dic:12};
  let y,m,d,r;
  if((r=s.match(/^(\d{4})[-\/ ](\d{1,2})[-\/ ](\d{1,2})$/)))[y,m,d]=[+r[1],+r[2],+r[3]];
  else if((r=s.match(/^(\d{1,2})[-\/ ](\d{1,2})[-\/ ](\d{4})$/)))[d,m,y]=[+r[1],+r[2],+r[3]];
  else if((r=s.match(/^(\d{1,2})[-\/ ]([a-zñ]+)[-\/ ](\d{4})$/))&&MESES[r[2].slice(0,4)]||(r&&MESES[r[2].slice(0,3)]))[d,m,y]=[+r[1],MESES[r[2].slice(0,4)]||MESES[r[2].slice(0,3)],+r[3]];
  else return null;
  const dt=new Date(y,m-1,d);
  return dt.getFullYear()===y&&dt.getMonth()===m-1&&dt.getDate()===d?iso(dt):null;
}
function numES(s,int){
  if(s==null)return null;s=String(s).replace(/[^0-9.,]/g,'');if(!s)return null;
  if(s.includes('.')&&s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(s.includes(','))s=s.replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  const n=parseFloat(s);if(!isFinite(n)||n<0)return null;return int?Math.round(n):Math.round(n*10)/10;
}
(function readZeppParams(){
  try{
    const q=new URLSearchParams(location.search);if(!q.has('zepp'))return;
    const fecha=parseFecha(q.get('fecha'))||todayISO();
    const p={fecha,pasos:numES(q.get('pasos'),true),kcal:numES(q.get('kcal'),true),sueno:numES(q.get('sueno'),false),at:new Date().toISOString()};
    if(p.sueno!=null&&p.sueno>24)p.sueno=Math.round(p.sueno/60*10)/10;   /* si llega en minutos */
    lsSet(ZKEY,p);
    history.replaceState(null,'',location.pathname+location.hash);
  }catch(e){}
})();
function applyZeppSync(){
  const p=lsGet(ZKEY,null);if(!p||!uid)return;
  lsSet(ZKEY,null);
  if(p.pasos==null&&p.kcal==null&&!p.sueno){toast('El Atajo no ha encontrado datos de Zepp en Salud. Abre Zepp para que sincronice y vuelve a intentarlo.','err');return}
  patchDay(p.fecha,o=>{
    if(p.pasos!=null)o.steps=p.pasos;
    if(p.sueno!=null&&p.sueno>0)o.sleep=p.sueno;
    o.zepp={kcal:p.kcal,pasos:p.pasos,sueno:p.sueno,at:p.at};
  });
  const bits=[];if(p.pasos!=null)bits.push(fmt(p.pasos)+' pasos');if(p.kcal!=null)bits.push(fmt(p.kcal)+' kcal activas');if(p.sueno)bits.push(fmt(p.sueno,1)+' h de sueño');
  toast('Zepp sincronizado: '+(bits.join(' · ')||'sin datos nuevos'));
}

function lastPerf(exId,date){
  const ks=Object.keys(S.workouts).filter(k=>k<date).sort().reverse();
  for(const k of ks){const sets=S.workouts[k]&&S.workouts[k].sets&&S.workouts[k].sets[exId];if(sets&&sets.some(s=>s&&s.r))return{date:k,sets:sets.filter(s=>s&&s.r)}}

}
function hintFor(ex,lp,ph){
  const unit=ex.u==='s'?'s':'reps';
  if(!lp)return{k:'',t:`Primera vez: elige un peso con el que hagas ${ex.hi} ${unit} dejando ${ph.rir} en reserva`};
  if(ph.deload)return{k:'hold',t:'Descarga: mismo peso, solo 2 series'};
  const allTop=lp.sets.length>=ex.s&&lp.sets.every(s=>+s.r>=ex.hi);
  if(ex.u==='s')return allTop?{k:'up',t:'Sube de mancuerna si el dolor está en 3/10 o menos'}:{k:'hold',t:'Mismo peso, alarga el tiempo'};
  if(allTop)return{k:'up',t:`Sube +${ex.low?'5':'2,5'} kg y vuelve a ${ex.lo} reps`};

function lineChart({pts,line,xmin,xmax,dec=1}){
  const W=340,H=180,L=38,R=12,T=14,B=24;
  const ys=[...pts,...(line||[])].map(p=>p.y);
  let y0=Math.min(...ys),y1=Math.max(...ys);
  if(y1-y0<2){const m=(y0+y1)/2;y0=m-1;y1=m+1}
  const pad=(y1-y0)*.12;y0-=pad;y1+=pad;if(xmax-xmin<6)xmax=xmin+6;
  const X=x=>L+(x-xmin)/(xmax-xmin)*(W-L-R),Y=y=>T+(y1-y)/(y1-y0)*(H-T-B);
  let g='';
  for(let i=0;i<4;i++){const v=y0+(y1-y0)*i/3;g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#23282e" stroke-width="1"/><text x="${L-6}" y="${Y(v)+3}" text-anchor="end">${fmt(v,dec)}</text>`}
  g+=`<text x="${L}" y="${H-6}">${shortDate(addDays(START,xmin))}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${shortDate(addDays(START,xmax))}</text>`;
  const dots=pts.map(p=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${line?2.6:3.5}" fill="${line?'#8d97a2':'#f39a1e'}" opacity="${line?.55:1}"/>`).join('');
  const src=line||pts;let ln='';
  if(src.length>1)ln=`<path d="${src.map((p,i)=>`${i?'L':'M'}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ')}" fill="none" stroke="#f39a1e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" style="filter:drop-shadow(0 0 4px #f39a1e66)"/>`;
  const last=src[src.length-1];
  const end=last?`<circle cx="${X(last.x)}" cy="${Y(last.y)}" r="5" fill="#f39a1e" stroke="#14171b" stroke-width="2"/><text x="${Math.min(X(last.x),W-R-30)}" y="${Math.max(Y(last.y)-10,T+8)}" text-anchor="middle" style="fill:#e8ecf0;font-weight:500">${fmt(last.y,dec)}</text>`:'';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}${dots}${ln}${end}</svg>`;
}
function weightSeries(){return Object.entries(S.days).filter(([k,v])=>v&&+v.weight>0).map(([k,v])=>({d:k,x:diffDays(START,k),y:+v.weight})).sort((a,b)=>a.x-b.x)}
function weeklyAvgs(ws){const m={};for(const p of ws){const w=Math.floor(p.x/7)+1;(m[w]=m[w]||[]).push(p.y)}return Object.entries(m).map(([w,a])=>({w:+w,n:a.length,avg:a.reduce((s,v)=>s+v,0)/a.length})).sort((a,b)=>a.w-b.w)}
function waistSeries(){const arr=Object.entries(S.checkins).filter(([k,v])=>v&&+v.waist>0).map(([k,v])=>({d:k,x:diffDays(START,k),y:+v.waist}));if(!arr.some(p=>p.x===0))arr.push({d:START,x:0,y:BASE.cintura});return arr.sort((a,b)=>a.x-b.x)}
function advice(ws){
  const wa=weeklyAvgs(ws),cw=weekOf(todayISO()),full=wa.filter(w=>w.w<cw&&w.n>=3);
  if(full.length<2)return{k:'info',t:'Recogiendo datos',d:'Pésate al menos 3 mañanas por semana. Con dos semanas completas te digo si hay que ajustar algo.'};
  const a=full[full.length-1],b=full[full.length-2],ch=a.avg-b.avg,wsr=waistSeries(),wd=wsr.length>1?wsr[wsr.length-1].y-wsr[wsr.length-2].y:0;
  const prevStall=full.length>=3&&(b.avg-full[full.length-3].avg)>-0.15,r=`${ch>0?'+':''}${fmt(ch,2)} kg en la última semana`;
  if(ch<-0.8)return{k:'warn',t:'Bajas demasiado rápido',d:`${r}. Riesgo de perder músculo. Sube 150 kcal: añade 40 g de pan o un plátano al día.`};
  if(ch>-0.15){

    if(prevStall)return{k:'warn',t:'Dos semanas estancado',d:`${r}. Primero suma 2.000 pasos al día. Si la semana que viene sigue igual, quita 150 kcal (30 g de arroz o pasta en la comida).`};
    return{k:'info',t:'Semana estable',d:`${r}. Revisa el apartado Fuera de plan (alcohol, picoteo). Espera otra semana antes de cambiar nada.`};
  }
  return{k:'good',t:'Ritmo ideal',d:`${r}. Estás dentro del rango de -0,2 a -0,8 kg por semana. Sigue igual.`};
}

    <ul class="small"><li>Lleva bolsas y cubos con el brazo relajado y la palma mirando hacia ti, y reparte el peso entre los dos brazos.</li><li>Guantes con buen agarre para no apretar tanto las herramientas.</li><li>Si tu médico lo aprueba, prueba una cincha epicondílea los días de mucha carga.</li><li>Si en 6 semanas no mejora, pide fisioterapia: el ejercicio guiado y las ondas de choque tienen buena evidencia.</li></ul>
  </section>
  <section class="card"><div class="eyebrow">4 · Nutrición</div><h2>Cómo comer</h2>
    <ul class="small">
      <li><b>Cumple el total diario.</b> Las 3 opciones de cada comida tienen macros parecidas: cambia cuando quieras y la app recalcula.</li>
      <li><b>Proteína repartida:</b> 30-45 g en cada comida. Lo que más importa es llegar a 175 g; repartirla ayuda un poco más.</li>
      <li><b>Alrededor del entreno:</b> 30-40 g de proteína en las 2 h antes o después. Si entrenas de noche, la cena es tu comida post-entreno.</li>
      <li><b>Antes de dormir</b> funciona bien un skyr o queso fresco batido: proteína de digestión lenta.</li>
      <li><b>Pesa en crudo</b> arroz, pasta, patata y carne las 2 primeras semanas. Luego lo calcularás a ojo.</li>
      <li><b>Verdura libre:</b> puedes repetir ensalada y verdura sin contarla.</li>
      <li><b>Alcohol:</b> máximo 2-3 consumiciones el fin de semana, y apúntalas. Frena la recuperación muscular y empeora el sueño.</li>
    </ul>
    <h3>Suplementos con evidencia</h3>
    <ul class="small"><li><b>Creatina monohidrato:</b> 3-5 g al día. Más fuerza y más músculo, y segura a tu edad.</li><li><b>Proteína whey:</b> solo por comodidad para llegar a la proteína.</li><li><b>Vitamina D:</b> solo si sale baja en una analítica.</li><li><b>Cafeína:</b> útil antes de entrenar por la mañana. Nada después de las 16:00.</li></ul>
  </section>
  <section class="card"><div class="eyebrow">5 · Hábitos</div><h2>Sueño, agua y pasos</h2>
    <p class="small"><b>El sueño es tu punto más débil.</b> Con 5-6 h, una buena parte del peso que pierdes puede salir del músculo en vez de la grasa, y la testosterona baja de forma medible.</p>
    <ul class="small"><li><b>Objetivo: 7-8 h.</b> Gana 30 min cada semana hasta llegar.</li><li>Hora fija para acostarte, también el fin de semana.</li><li>Entrena por la mañana siempre que puedas. Si entrenas a las 21-23 h: sin preentreno, ducha templada y cena justo después.</li><li>Habitación oscura y fresca. Móvil fuera 30 min antes.</li></ul>
    <p class="small"><b>Agua:</b> unos 3 L al día y 0,5-0,75 L más por cada hora de obra sudando. Orina amarillo claro.</p>
    <p class="small"><b>Pasos:</b> mínimo 10.000; ideal 12.000. No hace falta cardio extra: si te estancas, primero sumamos 2.000 pasos antes de bajar comida.</p>
  </section>
  <section class="card"><div class="eyebrow">6 · Seguimiento</div><h2>Cómo medir y ajustar</h2>
    <ul class="small"><li><b>Peso:</b> cada mañana, en ayunas y tras ir al baño. Solo cuenta la media semanal.</li><li><b>Cintura:</b> cada lunes, a la altura del ombligo, de pie, relajado y tras soltar el aire.</li><li><b>Fotos:</b> cada 2 semanas, misma luz y hora: frente, perfil y espalda.</li><li><b>Fuerza:</b> si las cargas suben mientras el peso baja, estás ganando o manteniendo músculo.</li></ul>

      <tr><td>La fuerza cae 2 semanas seguidas</td><td>Revisa sueño; +150 kcal de carbohidrato</td></tr>
    </tbody></table></div>
    <p class="small muted">La pestaña Progreso aplica estas reglas sola con tus datos. Este plan no sustituye el seguimiento de tu médico.</p>

const GKEY='recomp45-gemini-key',GMODEL='recomp45-gemini-model',CHATK='recomp45-chat';
const GAPI='https://generativelanguage.googleapis.com/v1beta/';
function aiReady(){if(lsGet(GKEY,'')) return true;openSettings('Para usar la IA, pega primero tu clave gratuita de Gemini.');return false}
async function pickModel(key){
  const r=await fetch(GAPI+'models?pageSize=200',{headers:{'x-goog-api-key':key}});
  if(!r.ok)throw await gErr(r);
  const j=await r.json();
  const ok=(j.models||[]).filter(m=>(m.supportedGenerationMethods||[]).includes('generateContent')).map(m=>m.name.replace('models/',''));
  const flash=ok.filter(n=>/^gemini-\d+(\.\d+)?-flash$/.test(n)).sort((a,b)=>parseFloat(b.split('-')[1])-parseFloat(a.split('-')[1]));
  const any=flash[0]||ok.find(n=>/^gemini-.*flash/.test(n)&&!/(lite|image|tts|live|audio|thinking)/.test(n))||ok.find(n=>/^gemini-/.test(n));
  if(!any)throw new Error('Tu clave no tiene ningún modelo Gemini disponible.');
  return any;
}
async function gErr(r){
  let msg='';try{const j=await r.json();msg=j.error&&j.error.message||''}catch(e){}
  if(r.status===400&&/API key/i.test(msg))return new Error('La clave de Gemini no es válida. Revísala en Ajustes.');
  if(r.status===403)return new Error('Esta clave no tiene permiso para usar Gemini.');
  if(r.status===429)return new Error('Has llegado al límite gratuito de Gemini por ahora. Prueba dentro de un rato.');
  if(r.status>=500)return new Error('Gemini está saturado. Prueba en un minuto.');
  return new Error('Error de Gemini'+(msg?': '+msg:'')+'.');
}
async function blobToB64(blob,max=1280){
  const bmp=await createImageBitmap(blob),sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  const url=c.toDataURL('image/jpeg',.82);return{data:url.split(',')[1],mime:'image/jpeg',url};
}
async function gemini({system,contents,json=false}){
  if(!navigator.onLine)throw new Error('Sin conexión: la IA necesita internet.');
  const key=lsGet(GKEY,'');if(!key)throw new Error('Falta la clave de Gemini.');
  let model=lsGet(GMODEL,'');if(!model){model=await pickModel(key);lsSet(GMODEL,model)}
  const body={contents,generationConfig:json?{responseMimeType:'application/json',temperature:.2}:{temperature:.6}};
  if(system)body.systemInstruction={parts:[{text:system}]};
  let r=await fetch(GAPI+'models/'+model+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body)});
  if(r.status===404){lsSet(GMODEL,'');model=await pickModel(key);lsSet(GMODEL,model);r=await fetch(GAPI+'models/'+model+':generateContent',{method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':key},body:JSON.stringify(body)})}
  if(!r.ok)throw await gErr(r);
  const j=await r.json(),cand=j.candidates&&j.candidates[0];
  const text=(cand&&cand.content&&cand.content.parts||[]).map(p=>p.text||'').join('').trim();
  if(!text)throw new Error(cand&&cand.finishReason==='SAFETY'?'Gemini no ha querido responder a eso. Pregúntalo de otra forma.':'No ha llegado respuesta. Prueba otra vez.');
  if(!json)return text;
  try{return JSON.parse(text)}catch(e){const m=text.match(/[\[{][\s\S]*[\]}]/);if(m)return JSON.parse(m[0]);throw new Error('No he podido leer la respuesta. Prueba otra vez.')}
}

  $('#chat-cam').onclick=()=>{$('#f-chatimg').value='';$('#f-chatimg').click()};
  $('#chat-att-x').onclick=()=>{chatImg=null;$('#chat-att').hidden=true};
  $('#chat-send').onclick=()=>sendChat($('#chat-in').value);
  $('#chat-in').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendChat($('#chat-in').value)}});
  if(prefill)sendChat(prefill);
}
$('#f-chatimg').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{chatImg=await blobToB64(f);$('#chat-att-img').src=chatImg.url;$('#chat-att').hidden=false}catch(err){toast('No puedo leer esa imagen. Prueba con otra.','err')}};
async function sendChat(text){
  text=(text||'').trim();if(busy||(!text&&!chatImg))return;
  if(!text)text='¿Qué ves en esta foto en relación con mi plan?';
  busy=true;const img=chatImg;chatImg=null;if($('#chat-att'))$('#chat-att').hidden=true;if($('#chat-in'))$('#chat-in').value='';
  chat.push({role:'user',text,img:img?img.url:null});renderChat();
  const think={role:'model',text:'Pensando…'};chat.push(think);renderChat();
  try{
    const hist=chat.slice(0,-1).filter(m=>!m.err).slice(-12);
    const contents=hist.map((m,i)=>{const parts=[{text:m.text}];if(i===hist.length-1&&img)parts.push({inline_data:{mime_type:img.mime,data:img.data}});return{role:m.role==='user'?'user':'model',parts}});
    const reply=await gemini({system:COACH_RULES+'\n\nDATOS DEL USUARIO:\n'+coachContext(),contents});
    think.text=reply;
  }catch(err){think.text=err.message||'Error con la IA.';think.err=1}
  busy=false;
  chat=chat.map(m=>m.img&&m.img.length>4000?{...m,img:null,text:m.text+' [foto]'}:m);
  lsSet(CHATK,chat.slice(-30));renderChat();
}

/* foto del plato o etiqueta */
let photoRes=null,photoImg=null;
$('#f-photo').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{photoImg=await blobToB64(f,1400)}catch(err){toast('No puedo leer esa imagen. Prueba con otra.','err');return}
  openSheet('Foto','Analizar comida',`<img class="preview" src="${photoImg.url}" alt="Foto del plato">
    <div class="field"><label for="ph-hint">Pista para la IA (opcional)</label><input type="text" id="ph-hint" placeholder="p. ej. media ración, con aceite, es de bar"></div>
    <button type="button" class="btn pri" id="ph-go">Analizar</button><div id="ph-out"></div>`);
  $('#ph-go').onclick=analyzePhoto;
};
async function analyzePhoto(){
  const out=$('#ph-out'),go=$('#ph-go');go.disabled=true;out.innerHTML='<p class="small muted">Analizando la foto…</p>';
  const hint=$('#ph-hint').value.trim();
  const prompt=`Analiza esta foto de comida o de una etiqueta nutricional para un registro de calorías en España.
Si es un plato: identifica cada alimento visible y estima su cantidad en gramos (o ml) tal como se ve, y sus kcal, proteína, carbohidratos y grasas para ESA cantidad (incluye el aceite probable de cocinado).
Si es una etiqueta: usa los valores de una ración o del envase indicado.
${hint?'Pista del usuario: '+hint+'\n':''}Responde SOLO con JSON con esta forma:
{"plato":"nombre corto","items":[{"n":"Arroz blanco cocido","g":180,"k":234,"p":4.5,"c":51,"f":0.5}],"confianza":"alta|media|baja","nota":"una frase con lo que conviene comprobar"}`;
  try{
    const res=await gemini({contents:[{role:'user',parts:[{text:prompt},{inline_data:{mime_type:photoImg.mime,data:photoImg.data}}]}],json:true});
    const items=(res.items||[]).filter(x=>x&&x.n).map(x=>({n:String(x.n),g:+x.g||0,k:+x.k||0,p:+x.p||0,c:+x.c||0,f:+x.f||0}));
    if(!items.length)throw new Error('No he reconocido comida en la foto. Prueba con otra más cerca.');
    photoRes={plato:res.plato||'Plato',items,base:items.map(x=>({...x})),conf:res.confianza||'',nota:res.nota||''};
    drawPhotoRes();
  }catch(err){out.innerHTML=`<p class="small" style="color:var(--bad)">${esc(err.message)}</p>`;go.disabled=false}
}
function drawPhotoRes(){
  const r=photoRes,tot=sumM(r.items.map(x=>({k:x.k,p:x.p,c:x.c,f:x.f})));
  $('#ph-go').hidden=true;
  $('#ph-out').innerHTML=`<div style="display:grid;gap:10px">
    <div class="row between"><h3>${esc(r.plato)}</h3>${r.conf?`<span class="pill ${r.conf==='alta'?'up':'hold'}">Confianza ${esc(r.conf)}</span>`:''}</div>
    ${r.items.map((x,i)=>`<div class="ai-item"><span>${esc(x.n)}</span><input type="number" inputmode="numeric" value="${Math.round(x.g)}" data-i="${i}" aria-label="Gramos de ${esc(x.n)}"><span class="m">${fmt(x.k)} kcal · P ${fmt(x.p)} · C ${fmt(x.c)} · G ${fmt(x.f)}</span></div>`).join('')}
    <div class="macroline"><span><b>${fmt(tot.k)} kcal</b></span><span class="pP">P ${fmt(tot.p)} g</span><span class="pC">C ${fmt(tot.c)} g</span><span class="pF">G ${fmt(tot.f)} g</span></div>
    ${r.nota?`<p class="note">${esc(r.nota)}</p>`:''}
    <p class="small muted">Corrige los gramos si sabes la cantidad real: las calorías se recalculan.</p>
    <button type="button" class="btn pri" id="ph-add">Añadir al ${st.date===todayISO()?'día de hoy':longDate(st.date)}</button></div>`;
  $('#ph-out').querySelectorAll('input[data-i]').forEach(inp=>inp.addEventListener('change',()=>{
    const i=+inp.dataset.i,b=r.base[i],g=+inp.value||0,f=b.g?g/b.g:0;r.items[i]={...b,g,k:b.k*f,p:b.p*f,c:b.c*f,f:b.f*f};drawPhotoRes()}));
  $('#ph-add').onclick=()=>{
    patchDay(st.date,o=>{for(const x of r.items)o.extras.push({n:x.n,g:Math.round(x.g),k:Math.round(x.k),p:Math.round(x.p),c:Math.round(x.c),f:Math.round(x.f),ia:1})});
    closeSheet();render();toast(`Añadido: ${r.plato} (${fmt(tot.k)} kcal)`);
  };
}

/* ================== COPIA, RESTAURAR Y PDF ================== */
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
function exportBackup(){
  const data={app:'recomp45',version:1,appVersion:APP_VERSION,exportado:new Date().toISOString(),datos:clone(S)};
  downloadBlob(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}),`recomp45-copia-${todayISO()}.json`);
  toast(`Copia descargada: ${Object.keys(S.days).length} días, ${Object.keys(S.workouts).length} entrenos`);
}
$('#f-restore').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  let j;try{j=JSON.parse(await f.text())}catch(err){toast('Ese archivo no es una copia válida.','err');return}
  const d=j&&j.app==='recomp45'&&j.datos;
  if(!d||!COLS.every(c=>typeof d[c]==='object')){toast('Ese archivo no es una copia de Recomp 45.','err');return}
  const n=COLS.reduce((a,c)=>a+Object.keys(d[c]).length,0);
  openSheet('Copia','Restaurar copia',`<p>Copia del <b>${esc((j.exportado||'').slice(0,10))}</b> con <b>${n}</b> registros: ${Object.keys(d.days).length} días, ${Object.keys(d.workouts).length} entrenos y ${Object.keys(d.checkins).length} revisiones.</p>
    <p class="note elbow">Los días que estén en la copia sustituyen a los mismos días de la app. Lo que no esté en la copia se queda como está.</p>
    <div class="row"><button type="button" class="btn pri" id="rs-go">Restaurar</button><button type="button" class="btn" id="rs-no">Cancelar</button></div>`);
  $('#rs-no').onclick=closeSheet;
  $('#rs-go').onclick=async()=>{
    $('#rs-go').disabled=true;let i=0;
    for(const c of COLS)for(const [id,doc] of Object.entries(d[c])){S[c][id]=doc;window.FB.db.set(path(c),id,doc);if(++i%40===0)await sleep(300)}
    closeSheet();render();toast(`Copia restaurada: ${n} registros`);
  };
};
function loadScript(src){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ko;document.head.append(s)})}
async function exportPdf(){
  try{
    toast('Preparando el PDF…');
    if(!window.jspdf)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),W=210,M=14;let y=M;
    const line=(txt,size=10,bold=false,color=[20,20,20])=>{doc.setFont('helvetica',bold?'bold':'normal');doc.setFontSize(size);doc.setTextColor(...color);
      for(const l of doc.splitTextToSize(String(txt),W-2*M)){if(y>285){doc.addPage();y=M}doc.text(l,M,y);y+=size*.45}};
    const gap=h=>{y+=h};
    doc.setFillColor(243,154,30);doc.rect(0,0,W,4,'F');
    const t=todayISO(),cw=Math.min(weekOf(t),12);
    line('Recomp 45 · Informe de progreso',18,true);gap(1);
    line(`Generado el ${new Date().toLocaleDateString('es-ES')} · Semana ${cw} de 12 (${phase(cw).n}) · Inicio 2 nov 2026`,9,false,[90,90,90]);gap(4);
    line('Punto de partida y objetivo',13,true);gap(1);
    line(`Hombre, 45 años, 175 cm. Inicio: ${BASE.peso} kg, ~${BASE.grasa}% grasa, cintura ${BASE.cintura} cm.`,10);
    line(`Objetivo diario: ${TARGET.kcal} kcal · proteína ${TARGET.p} g · carbohidratos ${TARGET.c} g · grasas ${TARGET.f} g.`,10);gap(4);
    const ws=weightSeries(),wsr=waistSeries(),wa=weeklyAvgs(ws);
    if(ws.length){const last=ws[ws.length-1];line(`Peso: ${fmt(last.y,1)} kg (${fmt(last.y-BASE.peso,1)} kg desde el inicio) · Cintura: ${fmt(wsr[wsr.length-1].y,1)} cm (${fmt(wsr[wsr.length-1].y-BASE.cintura,1)} cm)`,11,true);gap(3)}
    line('Semana a semana',13,true);gap(2);
    const cols=[M,32,58,82,108,132,156,180],head=['Sem.','Peso','Cintura','Kcal','Prot.','Sueño','Pasos','Codo'];
    doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(90,90,90);head.forEach((h,i)=>doc.text(h,cols[i],y));y+=5;doc.setFont('helvetica','normal');doc.setTextColor(20,20,20);
    for(let w=1;w<=cw;w++){
      const days=[...Array(7)].map((_,i)=>addDays(START,(w-1)*7+i)),dd=days.map(k=>S.days[k]).filter(Boolean),lg=dd.filter(hasLog).map(dayTotals);
      const avg=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:null,wav=wa.find(x=>x.w===w),ci=S.checkins[days[0]]||{};
      const sl=avg(dd.map(v=>+v.sleep).filter(v=>v>0)),stp=avg(dd.map(v=>+v.steps).filter(v=>v>0));
      const pains=days.map(k=>S.workouts[k]&&S.workouts[k].pain).filter(v=>v!=null),pn=avg(pains);
      const row=[String(w),wav?fmt(wav.avg,1):'-',ci.waist?fmt(ci.waist,1):'-',lg.length?fmt(avg(lg.map(x=>x.k))):'-',lg.length?fmt(avg(lg.map(x=>x.p))):'-',sl?fmt(sl,1)+' h':'-',stp?fmt(stp):'-',pn!=null?fmt(pn,1)+'/10':(ci.pain!=null?ci.pain+'/10':'-')];
      if(y>285){doc.addPage();y=M}row.forEach((v,i)=>doc.text(v,cols[i],y));y+=5;
    }
    gap(4);line('Progreso de fuerza (mejor serie: primera vs última)',13,true);gap(1);
    let any=false;
    for(const ex of ALL_EX){
      const logs=Object.keys(S.workouts).sort().map(k=>({k,sets:((S.workouts[k].sets||{})[ex.id]||[]).filter(s=>s&&s.r&&s.kg)})).filter(x=>x.sets.length);
      if(!logs.length)continue;any=true;
      const best=x=>x.sets.reduce((a,s)=>(+s.kg>+a.kg||(+s.kg===+a.kg&&+s.r>+a.r))?s:a);
      const a=best(logs[0]),b=best(logs[logs.length-1]);
      line(`• ${ex.n}: ${a.kg} kg x ${a.r} (${shortDate(logs[0].k)})  ->  ${b.kg} kg x ${b.r} (${shortDate(logs[logs.length-1].k)})`,9);
    }
    if(!any)line('Todavía no hay entrenos registrados.',9);
    const notes=Object.entries(S.checkins).sort().filter(([k,v])=>v.note);
    if(notes.length){gap(4);line('Notas de las revisiones',13,true);gap(1);for(const [k,v] of notes)line(`${shortDate(k)}: ${v.note}`,9)}
    gap(4);line('Este informe resume los datos registrados en la app. No sustituye la valoración de tu médico.',8,false,[120,120,120]);
    doc.save(`recomp45-informe-${t}.pdf`);
  }catch(err){console.warn(err);toast('No se pudo generar el PDF. Comprueba la conexión la primera vez.','err')}
}

/* actualizaciones (service worker) */
let swReg=null;
function applyUpdate(){if(swReg&&swReg.waiting)swReg.waiting.postMessage('SKIP_WAITING');else location.reload()}
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    swReg=reg;
    const offer=()=>toast('Hay una versión nueva de la app.','',{label:'Actualizar',fn:applyUpdate});
    if(reg.waiting&&navigator.serviceWorker.controller)offer();
    reg.addEventListener('updatefound',()=>{const nw=reg.installing;nw&&nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)offer()})});
    setInterval(()=>reg.update().catch(()=>{}),30*60*1000);
  }).catch(()=>{});
  let reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!reloaded){reloaded=true;location.reload()}});
}
