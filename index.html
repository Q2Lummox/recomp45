<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Recomp 45</title>
<meta name="description" content="Plan de recomposición corporal de 12 semanas.">
<meta name="theme-color" content="#14171b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Recomp 45">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: consola de taller en una columna para el móvil. Cabecera con semana y fecha, pestañas abajo,
   paneles con franja amarilla para IA, ajustes y copias. Mismo lenguaje visual que Taller 7L: un solo tema oscuro. */
:root{
  --bg:#0b0d10; --surface:#14171b; --surface-2:#1c2026; --well:#0c0e11; --ink:#e8ecf0; --muted:#8d97a2; --line:#2a3037;
  --accent:#f39a1e; --accent-2:#e2861a; --accent-ink:#1a1003; --accent-soft:#f39a1e24;
  --band:#f2c230; --band-ink:#1b1606;
  --p:#5aa2e6; --c:#e0b84a; --f:#a8bb64;
  --good:#2fc48d; --good-soft:#2fc48d1f; --warn:#f2c230; --warn-soft:#f2c2301f; --bad:#e8452c; --bad-soft:#e8452c24;
  --bevel:inset 0 1px 0 #ffffff12, inset 0 -1px 0 #00000080;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font:15px/1.45 var(--f-body);-webkit-text-size-adjust:100%;min-height:100vh;
  background:radial-gradient(1100px 520px at 55% -8%,#1b1f25 0%,transparent 70%),var(--bg)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* ===== cabecera ===== */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:linear-gradient(180deg,#1b1e23,#111316);border-bottom:1px solid #000;box-shadow:0 1px 0 #ffffff0a,0 6px 18px #0009}
.tape{height:5px;background:repeating-linear-gradient(-45deg,var(--accent) 0 10px,#111316 10px 20px)}
.top-in{max-width:640px;margin:0 auto;padding-block:10px 8px;display:grid;gap:8px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:1.5rem;letter-spacing:.03em;text-transform:uppercase;line-height:1;color:#f3f5f7;text-shadow:0 1px 0 #000}
.brand h1 span{color:var(--accent)}
.brand small{display:block;font-family:var(--f-mono);font-weight:400;font-size:.68rem;letter-spacing:.04em;color:var(--muted);margin-top:3px;text-transform:none;text-shadow:none}
.brand .acts{margin-left:auto;display:flex;gap:6px}
.hbtn{background:linear-gradient(180deg,#2c3138,#1a1e23);border:1px solid #3b424b;color:#e9edf1;box-shadow:var(--bevel),0 2px 6px #0008;font-family:var(--f-display);font-weight:600;font-size:.95rem;letter-spacing:.07em;text-transform:uppercase;padding:7px 12px;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
#btn-menu{position:relative}
#btn-menu.has-upd::after{content:"";position:absolute;top:4px;right:6px;width:9px;height:9px;border-radius:50%;background:#e8452c;box-shadow:0 0 0 2px #111316}
.hbtn.pri{background:linear-gradient(180deg,#f8b04c,var(--accent-2));border-color:#f9b75a;color:var(--accent-ink);box-shadow:inset 0 1px 0 #fff5,0 2px 10px #f39a1e40}
.datenav{display:flex;align-items:center;gap:6px}
.datenav .lbl{flex:1;text-align:center;font-family:var(--f-display);font-weight:600;font-size:1.05rem;letter-spacing:.05em;text-transform:uppercase}
.datenav button{background:var(--well);border:1px solid #2b3138;box-shadow:inset 0 1px 3px #000c;border-radius:4px;min-width:40px;height:34px;padding:0 10px;color:var(--ink)}
.datenav button.today{font-family:var(--f-display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:.85rem;color:var(--accent)}
.status{font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:6px;font-family:var(--f-mono)}
.status i{width:7px;height:7px;transform:rotate(45deg);background:var(--muted);display:inline-block}
.status.ok i{background:var(--good);box-shadow:0 0 6px var(--good)} .status.err i{background:var(--bad)} .status.wait i{background:var(--warn)}
.mpanel{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(100% + 4px);z-index:60;min-width:250px;background:linear-gradient(180deg,#1b1e23,#121417);border:1px solid #000;border-radius:5px;box-shadow:var(--bevel),0 14px 34px #000d;padding:6px;display:flex;flex-direction:column;gap:2px;animation:popIn .16s cubic-bezier(.2,.8,.2,1)}
.mi{all:unset;box-sizing:border-box;display:flex;flex-direction:column;padding:9px 12px;border-radius:3px;cursor:pointer;color:#dfe4e9;font-size:.92rem}
.mi small{color:var(--muted);font-size:.75rem}
.mi:hover,.mi:focus-visible{background:#ffffff0f;color:#fff}
.msep{height:1px;background:#000;box-shadow:0 1px 0 #ffffff0a;margin:4px 2px}

/* ===== contenido ===== */
main{max-width:640px;margin:0 auto;padding-block:14px calc(100px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
.card{background:linear-gradient(180deg,#171a1f,#121417);border:1px solid #23282e;border-radius:6px;box-shadow:var(--bevel);padding:14px;display:grid;gap:10px;min-width:0}
h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:1.05rem;letter-spacing:.12em;text-transform:uppercase;color:#cfd6dd;display:flex;align-items:center;gap:9px;line-height:1.15}
h2::before{content:"";width:7px;height:7px;background:var(--accent);transform:rotate(45deg);box-shadow:0 0 8px #f39a1e88;flex:none}
h2::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,#3a414a,transparent)}
h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:1.2rem;letter-spacing:.02em;line-height:1.15;color:#f3f5f7;text-wrap:balance}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.big-title{font-family:var(--f-display);font-weight:700;font-size:1.6rem;letter-spacing:.02em;text-transform:uppercase;line-height:1.05;color:#f3f5f7}
.muted{color:var(--muted)} .small{font-size:.86rem}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap} .between{justify-content:space-between} .grow{flex:1;min-width:0}
p{margin:0}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-display);font-weight:600;font-size:.9rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);white-space:nowrap}
.chip.acc{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn{border:1px solid #3b424b;background:linear-gradient(180deg,#2c3138,#1a1e23);color:#e9edf1;border-radius:4px;box-shadow:var(--bevel),0 2px 6px #0008;font-family:var(--f-display);font-weight:600;font-size:1rem;letter-spacing:.07em;text-transform:uppercase;padding:9px 14px;transition:transform .08s,border-color .15s}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(180deg,#f8b04c,var(--accent-2));border-color:#f9b75a;color:var(--accent-ink);box-shadow:inset 0 1px 0 #fff5,0 2px 10px #f39a1e40}
.btn.sm{padding:5px 10px;font-size:.88rem}
.btn:disabled{opacity:.45}
html,body,button,a,input,select,textarea,label{touch-action:manipulation}
.x{border:none;background:none;color:var(--muted);font-size:1.25rem;padding:0 6px}
input[type=number],input[type=text],input[type=password],select,textarea{width:100%;min-width:0;background:var(--well);border:1px solid #2b3138;border-radius:3px;box-shadow:inset 0 1px 3px #000c;padding:8px 10px;font-size:16px;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:inset 0 1px 3px #000c,0 0 0 2px #f39a1e33}
input[type=number]{font-family:var(--f-mono)}
input[type=range]{width:100%;accent-color:var(--accent)}
details summary{cursor:pointer;font-weight:600}
a{color:var(--accent)}

/* energía */
.energy{display:grid;grid-template-columns:124px 1fr;gap:16px;align-items:center}
.ring{position:relative;width:124px;height:124px}
.ring svg{width:124px;height:124px;transform:rotate(-90deg)}
.ring .ctr{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .big{font-family:var(--f-display);font-weight:700;font-size:2rem;line-height:1;color:#f3f5f7}
.ring .sub{font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.bars{display:grid;gap:9px;min-width:0}
.bar .lab{display:flex;justify-content:space-between;font-size:.84rem;gap:6px}
.bar .lab .num{white-space:nowrap}
.track{height:7px;border-radius:3px;background:#07080a;border:1px solid #23282e;box-shadow:inset 0 1px 2px #000;overflow:hidden}
.fill{height:100%;transition:width .3s}
@media (max-width:360px){.energy{grid-template-columns:1fr;justify-items:center}.bars{width:100%}}


.ss{display:inline-grid;place-items:center;min-width:30px;height:24px;padding:0 6px;margin-right:8px;border-radius:3px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);font-weight:700;font-size:.9rem;letter-spacing:.04em;vertical-align:2px}

/* revisión semanal */
.wz-card.due{border-color:var(--accent);box-shadow:var(--bevel),0 0 0 1px #f39a1e55,0 0 18px #f39a1e22}
.wz-dots{display:flex;gap:4px}
.wz-dots i{flex:1;height:4px;border-radius:2px;background:#2a3037}
.wz-dots i.done{background:var(--good)}.wz-dots i.on{background:var(--accent)}
.wz{display:grid;gap:12px}
.wz-list{margin:0;padding-left:1.2em;display:grid;gap:6px}
.wz-in{display:flex;align-items:center;gap:10px}
.wz-in input{font-size:2rem;padding:12px 14px;text-align:center;font-family:var(--f-display);font-weight:700}
.wz-in span{font-family:var(--f-display);font-size:1.3rem;color:var(--muted)}
.wz-photo{width:100%;max-height:46vh;object-fit:contain;border-radius:4px;border:1px solid var(--line);background:#07080a}
.wz-photo.empty{height:180px;display:grid;place-items:center;color:var(--muted);font-size:.9rem;border-style:dashed}
.wz-nav{position:sticky;bottom:0;background:var(--surface);padding-top:8px}
.wz-thumbs,.cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:8px}
.wz-thumbs figure,.cmp figure{margin:0;display:grid;gap:4px;text-align:center}
.wz-thumbs img,.cmp img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.cmp button{border:0;padding:0;background:none}
/* asistente de dieta y lista de la compra */
.dw-prog{display:flex;align-items:center;gap:10px}
.dw-opts{display:grid;gap:8px}
.dw-opt{display:grid;gap:4px;text-align:left;width:100%;border:1px solid #23282e;border-radius:5px;background:#101215;color:var(--ink);padding:10px 12px}
.dw-opt[aria-pressed=true]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent),0 0 14px #f39a1e22}
.dw-opt .t{font-weight:700;font-size:1.02rem}
.dw-opt .d{font-size:.82rem;color:var(--muted);line-height:1.35}
.dw-opt .m{font-family:var(--f-mono);font-size:.8rem;color:var(--accent)}
.dw-day{display:grid;gap:4px;border-bottom:1px dashed #2a3037;padding-bottom:10px}
.fixed-meal{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.shop{display:grid;gap:6px}
.shop .q{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);white-space:nowrap}
.shop .toggle[aria-pressed=true] .t{text-decoration:line-through;color:var(--muted)}
.wz-thumbs figcaption,.cmp figcaption{font-size:.75rem;color:var(--muted);text-transform:capitalize}
.mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.mcard{border:1px solid #23282e;background:#101215;border-radius:4px;padding:10px 12px;display:grid;gap:6px;min-width:0}
.mcard b{font-family:var(--f-display);font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:.95rem}

/* tarjeta del reloj */
.watch-card>.watch{border:none;background:none;padding:0}
.watch{border:1px solid #23282e;background:#101215;border-radius:4px;padding:12px;display:grid;gap:12px;min-width:0}
.watch-head{display:flex;align-items:center;gap:8px}
.watch-head label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;flex:1}
.gear{width:36px;height:36px;display:grid;place-items:center;border-radius:4px;border:1px solid #3b424b;background:linear-gradient(180deg,#2c3138,#1a1e23);box-shadow:var(--bevel);color:#cfd6dd}
.gear svg{width:20px;height:20px}
.gear:active{transform:rotate(30deg)}
.metric{display:grid;grid-template-columns:40px 1fr;gap:4px 12px;align-items:center}
.metric .ico{grid-row:span 2;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--pc) 16%,transparent);color:var(--pc);border:1px solid color-mix(in srgb,var(--pc) 45%,transparent)}
.metric .ico svg{width:22px;height:22px}
.metric .val{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;min-width:0}
.metric .val b{font-family:var(--f-display);font-weight:700;font-size:1.65rem;line-height:1;color:#f3f5f7}
.metric .val span{font-size:.82rem;color:var(--muted)}
.metric .val em{margin-left:auto;font-style:normal;font-family:var(--f-mono);font-size:.8rem;color:var(--pc)}
.pbar{height:10px;border-radius:5px;background:#07080a;border:1px solid #23282e;box-shadow:inset 0 1px 2px #000;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:5px;background:var(--pc);box-shadow:0 0 8px color-mix(in srgb,var(--pc) 60%,transparent);transition:width .4s}
.p-red{--pc:#e8452c}.p-orange{--pc:#ff8a1f}.p-yellow{--pc:#f2c230}.p-lime{--pc:#a6d936}.p-green{--pc:#2fc48d}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.76rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:2px;background:var(--pc)}

/* fase */
.phase{display:grid;gap:3px;border-left:4px solid var(--band);padding:10px 12px;background:linear-gradient(90deg,#f2c23014,transparent);border-radius:0 6px 6px 0}
.phase b{font-family:var(--f-display);font-size:1.05rem;letter-spacing:.06em;text-transform:uppercase;color:var(--band)}

/* hábitos */
.habits{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.habit{border:1px solid #23282e;background:#101215;border-radius:4px;padding:10px;display:grid;gap:6px;min-width:0}
.habit label,.field label,.field .flbl{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.habit .goal{font-size:.74rem;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:36px;height:36px;border-radius:4px;border:1px solid #3b424b;background:linear-gradient(180deg,#2c3138,#1a1e23);box-shadow:var(--bevel);font-weight:700;font-size:1.1rem}
.stepper .v{flex:1;text-align:center;font-family:var(--f-mono)}
.toggle{display:flex;align-items:center;gap:10px;border:1px solid #23282e;border-radius:4px;padding:10px 12px;background:#101215;text-align:left;width:100%;color:var(--ink)}
.toggle .box{width:22px;height:22px;border-radius:3px;border:2px solid #4a525b;display:grid;place-items:center;flex:none;font-weight:700}
.toggle[aria-pressed=true]{border-color:var(--good)}
.toggle[aria-pressed=true] .box{background:var(--good);border-color:var(--good);color:#05140d}
.toggle .t{font-weight:600} .toggle .d{font-size:.8rem;color:var(--muted)}
@media (max-width:360px){.habits{grid-template-columns:1fr}}

/* comidas */
.meal{border-left:4px solid var(--st,#3a4048)}
.meal.done{--st:var(--good)}
.meal-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.done-btn{border:1px solid #3b424b;background:linear-gradient(180deg,#2c3138,#1a1e23);box-shadow:var(--bevel);border-radius:3px;padding:6px 10px;font-family:var(--f-display);font-weight:600;font-size:.9rem;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.done-btn[aria-pressed=true]{background:var(--good);border-color:var(--good);color:#05140d}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--well);border:1px solid #000;border-radius:5px;box-shadow:inset 0 1px 3px #000c;padding:3px;gap:3px}
.seg button{border:0;border-radius:3px;background:none;color:#aeb6bf;padding:6px 6px;font-size:.78rem;line-height:1.2;text-align:left;min-width:0}
.seg button b{display:block;font-family:var(--f-display);font-size:.9rem;letter-spacing:.06em;text-transform:uppercase}
.seg button[aria-pressed=true]{background:linear-gradient(180deg,#f8b04c,var(--accent-2));color:var(--accent-ink);box-shadow:inset 0 1px 0 #fff5}
.items{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.items li{display:flex;justify-content:space-between;gap:10px;font-size:.9rem;border-bottom:1px dashed #2a3037;padding-bottom:4px}
.items li>span:last-child{font-family:var(--f-mono);font-size:.82rem;color:var(--muted);white-space:nowrap}
.macroline{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--f-mono);font-size:.8rem}
.pP{color:var(--p)} .pC{color:var(--c)} .pF{color:var(--f)}
.extra-form{display:grid;grid-template-columns:1fr 90px;gap:8px}
.seg2{grid-template-columns:1fr 1fr!important}
.fz-log{display:grid;gap:4px}
.fz-row{display:flex;gap:10px;align-items:baseline;border-bottom:1px dashed #23282e;padding-bottom:4px}
.fz-row .grow{min-width:0;overflow-wrap:anywhere}
.nut-head{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px}
.wo-save{width:100%;padding:14px;font-size:1.05rem}
.wo-done{display:grid;gap:6px;border:1px solid var(--good);background:var(--good-soft);border-radius:4px;padding:12px}
.wo-done b{color:var(--good)}.wo-done .btn{justify-self:start}
.done-chip{border-color:var(--good);color:var(--good)}
.mf-list{display:grid;gap:6px}
.mf-item{display:flex;align-items:center;gap:10px;text-align:left;border:1px solid #23282e;background:#101215;color:var(--ink);border-radius:4px;padding:10px 12px}
.mf-item small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:.76rem;margin-top:2px}
.mf-grid{display:grid;grid-template-columns:1fr 130px;gap:8px 10px;align-items:center}
.mf-grid label{font-size:.92rem}
.mf-in{display:flex;align-items:center;gap:6px}.mf-in input{text-align:right}.mf-in .u{color:var(--muted);font-family:var(--f-mono);font-size:.8rem;width:30px}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.eaten-tag{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.me-list{display:grid;gap:6px}
.me-row{display:grid;grid-template-columns:1fr 84px 30px;gap:8px;align-items:center;border-bottom:1px dashed #2a3037;padding-bottom:6px}
.me-row .nm{min-width:0;font-size:.92rem;line-height:1.25}
.me-row .nm small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:.74rem}
.me-row input{padding:6px 8px;text-align:right}
.me-res{display:grid;gap:4px}

.kpi .d{font-size:.76rem;color:var(--muted)}

.advice{border-radius:4px;padding:12px;display:grid;gap:4px;border-left:4px solid var(--muted);background:#101215}

td.num{white-space:nowrap}

.ovl-body{padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto;display:flex;flex-direction:column;gap:12px}

.toasts{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:80;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 16px}

/* ================== UTILIDADES ================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const parse=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diffDays=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const todayISO=()=>iso(new Date());
const fmt=(n,dec=0)=>Number(n).toLocaleString('es-ES',{minimumFractionDigits:dec,maximumFractionDigits:dec});
const DOW=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MON=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const shortDate=s=>{const d=parse(s);return `${d.getDate()} ${MON[d.getMonth()]}`};
const longDate=s=>{const d=parse(s);return `${DOW[d.getDay()]} ${d.getDate()} ${MON[d.getMonth()]}`};
const mondayOf=s=>{const d=parse(s);d.setDate(d.getDate()-((d.getDay()+6)%7));return iso(d)};
const clone=o=>JSON.parse(JSON.stringify(o??{}));
const mmss=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function lsGet(k,def){try{const v=localStorage.getItem(k);return v==null?def:JSON.parse(v)}catch(e){return def}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function weekOf(s){return Math.max(1,Math.floor(diffDays(START,s)/7)+1)}
function phase(w){
  if(w<=3) return {n:'Adaptación',rir:'3',t:'Deja 3 repeticiones en reserva. Técnica limpia y codos tranquilos mientras te adaptas al plan.'};
  if(w<=6) return {n:'Construcción',rir:'2',t:'Deja 2 en reserva: la última serie tiene que costar. Aplica la doble progresión cada sesión.'};
  if(w===7) return {n:'Descarga',rir:'3-4',deload:true,t:'Semana de descarga: solo 2 series por ejercicio con el mismo peso. Tendones y articulaciones se recuperan y vuelves más fuerte.'};
  if(w<=11) return {n:'Intensificación',rir:'1-2',t:'Deja 1-2 en reserva en los ejercicios principales. Nunca al fallo en los que cargan el codo.'};
  if(w===12) return {n:'Evaluación',rir:'2',t:'Última semana: repite las cargas de la semana 11, mide cintura, haz fotos y compara con la semana 1.'};
  return {n:'Plan completado',rir:'2',t:'Has terminado las 12 semanas. Sigue registrando y preparamos el siguiente bloque.'};
}
function itemM(fid,g){const F=FOODS[fid];if(!F)return{k:0,p:0,c:0,f:0};const m=g/100;return{k:F.k*m,p:F.p*m,c:F.c*m,f:F.f*m}}
function sumM(list){return list.reduce((a,b)=>({k:a.k+b.k,p:a.p+b.p,c:a.c+b.c,f:a.f+b.f}),{k:0,p:0,c:0,f:0})}
function optM(o){return sumM(o.items.map(([id,g])=>itemM(id,g)))}
/* lo comido de verdad: si cambiaste la comida, cuentan tus alimentos; si no, la opción del plan */
function mealM(m,st){return st&&Array.isArray(st.items)?sumM(st.items.map(x=>({k:+x.k||0,p:+x.p||0,c:+x.c||0,f:+x.f||0}))):optM(m.opts[(st&&st.opt)||'A'])}
function qty(fid,g){const F=FOODS[fid];if(F.u){const n=g/F.u[0];if(Math.abs(n-Math.round(n))<.01){const r=Math.round(n);return `${r} ${r===1?F.u[1]:F.u[2]} (${g} g)`}}return `${fmt(g)} ${F.ml?'ml':'g'}`}

function toast(msg,kind='',action){
  const t=document.createElement('div');t.className='toast '+kind;const s=document.createElement('span');s.textContent=msg;t.append(s);
  if(action){const b=document.createElement('button');b.type='button';b.textContent=action.label;b.onclick=()=>{t.remove();action.fn()};t.append(b)}
  $('#toasts').append(t);setTimeout(()=>t.remove(),action?12000:4200);
}
let sheetOnClose=null;
function openSheet(k,title,html,onClose){$('#sheet-k').textContent=k;$('#sheet-title').textContent=title;$('#sheet-body').innerHTML=html;$('#sheet').hidden=false;sheetOnClose=onClose||null;document.body.style.overflow='hidden'}
function closeSheet(){$('#sheet').hidden=true;document.body.style.overflow='';if(sheetOnClose){const f=sheetOnClose;sheetOnClose=null;f()}}

/* ================== DATOS (Firestore) ================== */
const S={days:{},workouts:{},checkins:{}};
const COLS=['days','workouts','checkins'];
let uid=null,pendingRender=false,unsubs=[],firstLoad={},seeded=false;
const dirty={},timers={};
const path=col=>`users/${uid}/${col}`;
function setStatus(kind,text){const el=$('#status');el.className='status '+kind;el.querySelector('span').textContent=text}
function saveDoc(col,id,data){
  S[col][id]=data;const k=col+'/'+id;dirty[k]=true;
  clearTimeout(timers[k]);
  timers[k]=setTimeout(()=>{window.FB.db.set(path(col),id,clone(S[col][id]));setTimeout(()=>{delete dirty[k]},2500)},500);
}
function startData(){
  unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];
  const state={};
  for(const col of COLS){
    unsubs.push(window.FB.db.watch(path(col),snap=>{
      const o={};snap.docs.forEach(d=>{o[d.id]=d.data});
      for(const k of Object.keys(dirty)){const [c,id]=k.split('/');if(c===col&&S[col][id])o[id]=S[col][id]}
      S[col]=o;state[col]=snap;
      if(!snap.fromCache)firstLoad[col]=true;
      const all=COLS.map(c=>state[c]).filter(Boolean);
      if(all.length===COLS.length){
        if(all.some(s=>s.fromCache))setStatus('wait','Sin conexión · lo que apuntes se sube al volver');
        else if(all.some(s=>s.pending))setStatus('wait','Guardando…');
        else setStatus('ok','Sincronizado con tu cuenta');
      }
      maybeSeed();requestRender();
    }));
  }
  /* buzón del Atajo: users/<uid>/zepp/<día>, escrito en segundo plano */
  unsubs.push(window.FB.db.watch(path('zepp'),onZeppSnap));
  unsubs.push(window.FB.db.watch(path('ajustes'),snap=>{const o={};snap.docs.forEach(d=>{o[d.id]=d.data});AJ=o;applyMyFoods();if(o.zepp&&o.zepp.k)zeppKey=o.zepp.k;requestRender()}));
}
function maybeSeed(){
  if(!COLS.every(c=>firstLoad[c]))return;
  applyZeppSync();processZeppInbox();
  seeded=true;   /* sin datos inventados: el punto de partida lo apuntas tú el primer lunes */
}

/* ===== Zepp (vía Salud de Apple y el Atajo «Recomp Zepp») =====
   El Atajo abre ...?zepp=1&fecha=DD-MM-AAAA&pasos=N&kcal=N[&sueno=H]
   La fecha vale como día-mes-año (03-11-2026, 03/11/2026, 03-nov-2026) o año-mes-día; si falta, es hoy.
   Los datos se guardan aquí y se aplican al día cuando ya se han cargado tus datos, para no pisar nada. */
const ZKEY='recomp45-zepp-pending',SHORTCUT='Recomp Zepp';
function parseFecha(s){
  if(!s)return null;s=String(s).trim().toLowerCase().replace(/\./g,'');
  const MESES={ene:1,feb:2,mar:3,abr:4,may:5,jun:6,jul:7,ago:8,sep:9,sept:9,set:9,oct:10,nov:11,dic:12};
  let y,m,d,r;
  if((r=s.match(/^(\d{4})[-\/ ](\d{1,2})[-\/ ](\d{1,2})$/)))[y,m,d]=[+r[1],+r[2],+r[3]];
  else if((r=s.match(/^(\d{1,2})[-\/ ](\d{1,2})[-\/ ](\d{4})$/)))[d,m,y]=[+r[1],+r[2],+r[3]];
  else if((r=s.match(/^(\d{1,2})[-\/ ]([a-zñ]+)[-\/ ](\d{4})$/))&&MESES[r[2].slice(0,4)]||(r&&MESES[r[2].slice(0,3)]))[d,m,y]=[+r[1],MESES[r[2].slice(0,4)]||MESES[r[2].slice(0,3)],+r[3]];
  else return null;
  const dt=new Date(y,m-1,d);
  return dt.getFullYear()===y&&dt.getMonth()===m-1&&dt.getDate()===d?iso(dt):null;
}
function numES(s,int){
  if(s==null)return null;s=String(s).replace(/[^0-9.,]/g,'');if(!s)return null;
  if(s.includes('.')&&s.includes(','))s=s.replace(/\./g,'').replace(',','.');
  else if(s.includes(','))s=s.replace(',','.');
  else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  const n=parseFloat(s);if(!isFinite(n)||n<0)return null;return int?Math.round(n):Math.round(n*10)/10;
}
(function readZeppParams(){
  try{
    const q=new URLSearchParams(location.search);if(!q.has('zepp'))return;
    const fecha=parseFecha(q.get('fecha'))||todayISO();
    const p={fecha,pasos:numES(q.get('pasos'),true),kcal:numES(q.get('kcal'),true),sueno:numES(q.get('sueno'),false),at:new Date().toISOString()};
    if(p.sueno!=null&&p.sueno>24)p.sueno=Math.round(p.sueno/60*10)/10;   /* si llega en minutos */
    lsSet(ZKEY,p);
    history.replaceState(null,'',location.pathname+location.hash);
  }catch(e){}
})();
function applyZeppSync(){
  const p=lsGet(ZKEY,null);if(!p||!uid)return;
  lsSet(ZKEY,null);
  if(p.pasos==null&&p.kcal==null&&!p.sueno){toast('El Atajo no ha encontrado datos de Zepp en Salud. Abre Zepp para que sincronice y vuelve a intentarlo.','err');return}
  patchDay(p.fecha,o=>{
    if(p.pasos!=null)o.steps=p.pasos;
    if(p.sueno!=null&&p.sueno>0)o.sleep=p.sueno;
    o.zepp={kcal:p.kcal,pasos:p.pasos,sueno:p.sueno,at:p.at};
  });
  const bits=[];if(p.pasos!=null)bits.push(fmt(p.pasos)+' pasos');if(p.kcal!=null)bits.push(fmt(p.kcal)+' kcal activas');if(p.sueno)bits.push(fmt(p.sueno,1)+' h de sueño');
  toast('Zepp sincronizado: '+(bits.join(' · ')||'sin datos nuevos'));
}

/* ===== Zepp en segundo plano =====
   El Atajo escribe directamente en Firestore (users/<uid>/zepp/<día>) con una clave secreta
   que solo conoce tu cuenta; las reglas comprueban esa clave. La app escucha ese buzón y,
   en cuanto llega algo nuevo, lo pasa al día y avisa. No se abre Safari ni nada. */
let zeppIn=[],zeppKey=null,zeppFirst=true,zeppTouched=new Set();
function onZeppSnap(snap){
  zeppIn=snap.docs;
  /* días que el Atajo acaba de escribir (aunque traiga los mismos números): para confirmarlo */
  if(!zeppFirst)for(const c of (snap.changes||[]))if(c.type!=='removed'){const f=parseFecha(c.id);if(f)zeppTouched.add(f)}
  zeppFirst=false;
  processZeppInbox();
}
/* sueño en cualquier formato: «8 h 56 min», «8:56:00», «536 min», 32160 (s), 536 (min) u 8,9 (h) → horas */
function parseSleep(raw){
  if(raw==null)return null;const s=String(raw).trim().toLowerCase();if(!s)return null;
  let h=s.match(/(\d+(?:[.,]\d+)?)\s*(?:h|hr|hrs|hora|horas)\b/),m=s.match(/(\d+(?:[.,]\d+)?)\s*(?:min|mins|minutos?|m)\b/),sec=s.match(/(\d+(?:[.,]\d+)?)\s*(?:s|seg|segundos?)\b/);
  let t=null;
  if(h||m||sec)t=(h?numES(h[1],false):0)+(m?numES(m[1],false)/60:0)+(sec?numES(sec[1],false)/3600:0);
  else{const c=s.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?$/);
    if(c)t=+c[1]+(+c[2])/60+(c[3]?+c[3]/3600:0);
    else{const n=numES(s,false);if(n==null)return null;t=n>1440?n/3600:n>24?n/60:n}}
  if(!(t>0)||t>14)return null;   /* más de 14 h: casi seguro sueño contado dos veces */
  return Math.round(t*100)/100;
}
function processZeppInbox(){
  if(!uid||!COLS.every(c=>firstLoad[c])||!zeppIn.length)return;
  const touched=zeppTouched;zeppTouched=new Set();
  /* un registro por día; si hay dos del mismo día (formatos de fecha distintos), vale el de más pasos */
  const byDay={};let emptyHit=null;
  for(const d of zeppIn){
    const x=d.data||{},fecha=parseFecha(d.id);if(!fecha)continue;
    const pasos=numES(x.pasos,true),kcal=numES(x.kcal,true),sueno=parseSleep(x.sueno);
    if(pasos==null&&kcal==null&&!sueno){if(touched.has(fecha))emptyHit=fecha;continue}
    const prev=byDay[fecha];
    if(!prev||(pasos??-1)>(prev.pasos??-1)||((pasos??-1)===(prev.pasos??-1)&&(kcal??-1)>(prev.kcal??-1)))byDay[fecha]={fecha,pasos,kcal,sueno};
  }
  let last=null,same=null;
  for(const {fecha,pasos,kcal,sueno} of Object.values(byDay).sort((a,b)=>a.fecha.localeCompare(b.fecha))){
    const cur=(S.days[fecha]||{}).zepp||{};
    const equal=(cur.pasos??null)===pasos&&(cur.kcal??null)===kcal&&(cur.sueno??null)===(sueno||null);
    if(equal&&!touched.has(fecha))continue;
    patchDay(fecha,o=>{if(pasos!=null)o.steps=pasos;if(sueno)o.sleep=sueno;o.zepp={kcal,pasos,sueno:sueno||null,at:new Date().toISOString()}});
    if(equal)same={fecha,pasos,kcal};else last={fecha,pasos,kcal};
  }
  const txt=r=>{const b=[];if(r.pasos!=null)b.push(fmt(r.pasos)+' pasos');if(r.kcal!=null)b.push(fmt(r.kcal)+' kcal activas');return b.join(' · ')+(r.fecha!==todayISO()?' ('+shortDate(r.fecha)+')':'')};
  if(last)toast('Zepp actualizado: '+txt(last));
  else if(same)toast('Zepp comprobado, sin cambios: '+txt(same)+'. Si Zepp marca más, ábrelo para que pase los datos a Salud.');
  else if(emptyHit)toast('El Atajo ha llegado, pero Salud aún no tiene datos de Zepp de hoy. Abre Zepp para que sincronice y vuelve a probar.','err');
  if(last||same)requestRender();
}
async function ensureZeppKey(){
  if(zeppKey)return zeppKey;
  const docs=await window.FB.db.getAll(path('ajustes'));
  const z=docs.find(d=>d.id==='zepp');
  if(z&&z.data&&z.data.k){zeppKey=z.data.k;return zeppKey}
  const a=new Uint8Array(18);crypto.getRandomValues(a);
  zeppKey=Array.from(a,b=>'abcdefghijkmnpqrstuvwxyz23456789'[b%32]).join('');
  window.FB.db.set(path('ajustes'),'zepp',{k:zeppKey,creada:new Date().toISOString()});
  return zeppKey;
}
const ZEPP_RULES=`rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /users/{uid}/{document=**} {
      allow read, write: if request.auth != null && request.auth.uid == uid;
    }
    match /users/{uid}/zepp/{dia} {
      allow create, update: if request.resource.data.keys().hasOnly(['k', 'pasos', 'kcal', 'sueno', 'hora'])
        && request.resource.data.k is string
        && request.resource.data.k == get(/databases/$(database)/documents/users/$(uid)/ajustes/zepp).data.k;
    }
  }
}`;

/* ===== asistente de dieta y lista de la compra (v1.10.0) =====
   Guarda en users/<uid>/ajustes: menu {plan:{fecha:{des,alm,com,mer,cen}}} y compra {semana, items:{alimento:g}, done}.
   Van en ajustes para que «Empezar de cero» no los borre. */
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const SHOP_CATS=[
  ['Fruta y verdura',['platano','manzana','naranja','frutosrojos','aguacate','tomate','verdura','patata','boniato']],
  ['Carne y pescado',['pollo','pavocarne','ternera','cerdo','salmon','merluza','bacalao','gambas']],
  ['Charcutería y queso',['pavo','jamon','quesocurado']],
  ['Lácteos y huevos',['leche','skyr','quesofresco','quesoburgos','huevo','claras']],
  ['Pan',['pan','panint','tortillatrigo']],
  ['Despensa',['avena','arroz','pasta','lentejas','garbanzos','tomatetrit','atun','nueces','cacahuete','miel','chocolate','aove','whey']],
];
const shopName=id=>FOODS[id].n.replace(/ \((en crudo|en seco)\)/,'');
function shopQty(id,g){
  const F=FOODS[id];
  if(F.u){const n=Math.ceil(g/F.u[0]-.01);return `${n} ${n===1?F.u[1]:F.u[2]}`}
  const w=F.ml?(g>=1000?`${fmt(Math.ceil(g/100)/10,1)} L`:`${Math.ceil(g/50)*50} ml`):(g>=1000?`${fmt(Math.ceil(g/100)/10,1)} kg`:`${Math.ceil(g/10)*10} g`);
  if(id==='pan'){const b=Math.ceil(g/250);return `${w} · ${b} ${b===1?'barra':'barras'}`}
  return w;
}
const weekDays=mon=>[...Array(7)].map((_,i)=>addDays(mon,i));
function menuCard(){
  const thisMon=mondayOf(todayISO()),nextMon=addDays(thisMon,7);
  const line=(mon,lab)=>{const n=weekDays(mon).filter(planOf).length;
    return `<li><span>${lab} · ${shortDate(mon)} – ${shortDate(addDays(mon,6))}</span><span>${n===7?'<b style="color:var(--good)">Fijado</b>':n?`${n} de 7 días`:'Sin fijar'}</span></li>`};
  const c=AJ.compra,ids=c&&c.items?Object.keys(c.items):[],nd=ids.filter(k=>c.done&&c.done[k]).length;
  return `<section class="card"><div class="row between"><div><div class="eyebrow">Menú semanal</div><h2 style="margin:0">Asistente de dieta</h2></div><button type="button" class="btn pri" data-act="diet">Organizar</button></div>
    <ul class="items">${line(thisMon,'Esta semana')}${line(nextMon,'La que viene')}</ul>
    ${ids.length?`<button type="button" class="btn" data-act="shop">🛒 Lista de la compra · <span class="num">${nd}/${ids.length}</span></button>`:'<p class="small muted">Al terminar el asistente tendrás aquí la lista de la compra.</p>'}</section>`;
}
let DW=null;
function openDiet(){
  const mon=addDays(mondayOf(todayISO()),7),days=weekDays(mon),sel={};
  days.forEach(d=>{const p=planOf(d);sel[d]=p?{...p}:{}});
  DW={i:0,mon,days,sel,had:days.some(planOf),busy:false};drawDiet();
}
function drawDiet(){
  const {i,mon,days,sel}=DW,N=days.length*MEALS.length;
  let body,nav='';
  if(i===0){
    body=`<div><div class="eyebrow">Semana que viene</div><div class="big-title">${shortDate(mon)} – ${shortDate(addDays(mon,6))}</div></div>
      <p class="small">Para cada día te propongo seis desayunos, seis almuerzos, seis comidas, seis meriendas y seis cenas. Tú eliges uno de cada.</p>
      <ul class="small wz-list"><li>El menú de esta semana no se toca.</li><li>Al terminar, esos días quedan fijados en Comida y ya no tendrás que elegir.</li><li>La lista de la compra anterior se borra y se crea una nueva con todo lo de esa semana.</li>${DW.had?'<li>Esa semana ya tenía menú: verás marcado lo que elegiste y puedes cambiarlo.</li>':''}<li>Si cierras antes de terminar, no cambia nada.</li></ul>`;
    nav=`<span class="grow"></span><button type="button" class="btn pri" data-dw="next">Empezar</button>`;
  }else if(i<=N){
    const di=Math.floor((i-1)/MEALS.length),m=MEALS[(i-1)%MEALS.length],d=days[di],cur=sel[d][m.id],prev=di>0?sel[days[di-1]][m.id]:null;
    body=`<div class="dw-prog"><div class="track grow"><div class="fill" style="width:${i/N*100}%;background:var(--accent)"></div></div><span class="small muted num">${i} / ${N}</span></div>
      <div><div class="eyebrow">${cap(longDate(d))}</div><div class="big-title">${m.n}</div></div>
      <div class="dw-opts">${Object.entries(m.opts).map(([k,o])=>{const mm=optM(o);
        return `<button type="button" class="dw-opt" data-dw="pick" data-opt="${k}" aria-pressed="${cur===k}"><span class="row between"><span class="t">${esc(o.t)}</span>${prev===k?'<span class="pill">Ayer</span>':''}</span><span class="d">${o.items.map(([id])=>esc(shopName(id))).join(' · ')}</span><span class="m">${fmt(mm.k)} kcal · P ${fmt(mm.p)} g</span></button>`}).join('')}</div>`;
    nav=`<button type="button" class="btn" data-dw="back">‹ Atrás</button><span class="grow"></span>${cur?'<button type="button" class="btn" data-dw="next">Siguiente ›</button>':''}`;
  }else{
    body=`<p class="small">Repasa la semana. Toca <b>Cambiar</b> en un día para corregirlo.</p>`+days.map((d,di)=>{
      const os=MEALS.map(m=>m.opts[sel[d][m.id]]),t=sumM(os.map(optM));
      return `<div class="dw-day"><div class="row between"><b>${cap(longDate(d))}</b><button type="button" class="btn sm" data-dw="goto" data-i="${1+di*MEALS.length}">Cambiar</button></div>
        <p class="small muted" style="margin:0">${os.map(o=>esc(o.t)).join(' · ')}</p><span class="small num">${fmt(t.k)} kcal · P ${fmt(t.p)} g</span></div>`}).join('');
    nav=`<button type="button" class="btn" data-dw="back">‹ Atrás</button><span class="grow"></span><button type="button" class="btn pri" data-dw="save">Guardar y crear lista</button>`;
  }
  openSheet('Menú','Asistente de dieta',`<div class="wz">${body}</div><div class="row wz-nav">${nav}</div>`,()=>{DW=null});
  $('#sheet-body').scrollTop=0;
  $('#sheet-body').onclick=e=>{const b=e.target.closest('[data-dw]');if(!b||!DW||DW.busy)return;const a=b.dataset.dw;
    if(a==='next'){DW.i++;drawDiet()}
    else if(a==='back'){DW.i=Math.max(0,DW.i-1);drawDiet()}
    else if(a==='goto'){DW.i=+b.dataset.i;DW.edit=true;drawDiet()}
    else if(a==='save')saveDiet();
    else if(a==='pick'){
      const di=Math.floor((DW.i-1)/MEALS.length),m=MEALS[(DW.i-1)%MEALS.length];DW.sel[DW.days[di]][m.id]=b.dataset.opt;
      b.parentNode.querySelectorAll('.dw-opt').forEach(x=>x.setAttribute('aria-pressed',x===b));
      DW.busy=true;setTimeout(()=>{if(!DW)return;DW.busy=false;
        /* al corregir un día desde el resumen, vuelve al resumen al terminar ese día */
        if(DW.edit&&DW.i%MEALS.length===0){DW.i=N+1;DW.edit=false}else DW.i++;drawDiet()},200);
    }};
}
function saveDiet(){
  const menu=clone(AJ.menu||{});menu.plan=menu.plan||{};
  const cut=addDays(mondayOf(todayISO()),-28);
  for(const k of Object.keys(menu.plan))if(k<cut)delete menu.plan[k];
  const items={};
  for(const d of DW.days){menu.plan[d]={...DW.sel[d]};
    for(const m of MEALS)for(const [id,g] of m.opts[DW.sel[d][m.id]].items)items[id]=(items[id]||0)+g}
  menu.at=new Date().toISOString();
  const compra={semana:DW.mon,items,done:{},at:menu.at};
  AJ.menu=menu;AJ.compra=compra;
  window.FB.db.set(path('ajustes'),'menu',menu);window.FB.db.set(path('ajustes'),'compra',compra);
  DW=null;render();openShop();toast('Menú de la semana fijado y lista de la compra nueva');
}
function shopText(){
  const c=AJ.compra,L=[`Lista de la compra · ${shortDate(c.semana)} – ${shortDate(addDays(c.semana,6))}`];
  for(const [cat,ids] of shopGroups(c)){L.push('',cat.toUpperCase());for(const id of ids)L.push(`- ${shopName(id)}: ${shopQty(id,c.items[id])}`)}
  return L.join('\n');
}
function shopGroups(c){
  const all=Object.keys(c.items).filter(id=>FOODS[id]),used=new Set(),out=[];
  for(const [cat,ids] of SHOP_CATS){const l=ids.filter(id=>c.items[id]);l.forEach(id=>used.add(id));if(l.length)out.push([cat,l])}
  const rest=all.filter(id=>!used.has(id));if(rest.length)out.push(['Otros',rest]);
  return out;
}
function openShop(){
  if(!AJ.compra||!AJ.compra.items){toast('Todavía no hay lista: pulsa Organizar en el asistente de dieta');return}
  openSheet('Compra','Lista de la compra','');drawShop();
}

function numLbl(v){if(v==null||v==='')return null;if(typeof v==='number')return isFinite(v)?v:null;const m=String(v).replace(',','.').match(/-?\d+(\.\d+)?/);return m?+m[0]:null}
function flatLabel(r){
  if(Array.isArray(r))r=r[0]||{};
  const o={};const walk=x=>{for(const [k,v] of Object.entries(x||{})){if(v&&typeof v==='object'&&!Array.isArray(v))walk(v);else if(!(k in o))o[k]=v}};walk(r);
  const al={k:['k','kcal','energia','calorias','energy'],p:['p','proteinas','protein','proteina'],c:['c','hidratos','carbohidratos','hidratos_de_carbono','carbs'],az:['az','azucares','sugars','azucar'],
    f:['f','grasas','grasa','fat','lipidos'],fib:['fib','fibra','fiber'],sal:['sal','salt'],sod:['sod','sodio','sodium'],racion:['racion','porcion','serving'],nombre:['nombre','name'],parecido:['parecido'],ml:['ml'],legible:['legible']};
  const out={},nk=Object.fromEntries(Object.entries(o).map(([k,v])=>[norm(k).replace(/\s+/g,'_'),v]));
  for(const [k,names] of Object.entries(al))for(const n of names)if(nk[n]!=null){out[k]=nk[n];break}
  return out;
}

function lineChart({pts,line,xmin,xmax,dec=1}){
  const W=340,H=180,L=38,R=12,T=14,B=24;
  const ys=[...pts,...(line||[])].map(p=>p.y);
  let y0=Math.min(...ys),y1=Math.max(...ys);
  {const m=(y0+y1)/2,minR=dec===0?Math.max(3,Math.abs(m)*.06):2;if(y1-y0<minR){y0=m-minR/2;y1=m+minR/2}}
  const pad=(y1-y0)*.12;y0-=pad;y1+=pad;if(xmax-xmin<6)xmax=xmin+6;
  const X=x=>L+(x-xmin)/(xmax-xmin)*(W-L-R),Y=y=>T+(y1-y)/(y1-y0)*(H-T-B);
  let g='';
  for(let i=0;i<4;i++){const v=y0+(y1-y0)*i/3;g+=`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#23282e" stroke-width="1"/><text x="${L-6}" y="${Y(v)+3}" text-anchor="end">${fmt(v,dec)}</text>`}
  g+=`<text x="${L}" y="${H-6}">${shortDate(addDays(START,xmin))}</text><text x="${W-R}" y="${H-6}" text-anchor="end">${shortDate(addDays(START,xmax))}</text>`;
  const dots=pts.map(p=>`<circle cx="${X(p.x)}" cy="${Y(p.y)}" r="${line?2.6:3.5}" fill="${line?'#8d97a2':'#f39a1e'}" opacity="${line?.55:1}"/>`).join('');
  const src=line||pts;let ln='';
  if(src.length>1)ln=`<path d="${src.map((p,i)=>`${i?'L':'M'}${X(p.x).toFixed(1)},${Y(p.y).toFixed(1)}`).join(' ')}" fill="none" stroke="#f39a1e" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" style="filter:drop-shadow(0 0 4px #f39a1e66)"/>`;
  const last=src[src.length-1];
  const end=last?`<circle cx="${X(last.x)}" cy="${Y(last.y)}" r="5" fill="#f39a1e" stroke="#14171b" stroke-width="2"/><text x="${Math.min(X(last.x),W-R-30)}" y="${Math.max(Y(last.y)-10,T+8)}" text-anchor="middle" style="fill:#e8ecf0;font-weight:500">${fmt(last.y,dec)}</text>`:'';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}${dots}${ln}${end}</svg>`;
}
/* barras por semana con línea de objetivo opcional (kilos movidos, medias de nutrición) */
function barChart({bars,target,color='#f39a1e',dec=0,unit=''}){
  const W=340,H=170,L=42,R=10,T=18,B=30,n=bars.length;
  const vals=bars.map(b=>b.v||0),raw=(Math.max(...vals,target||0)*1.12||1)/3,mag=10**Math.floor(Math.log10(raw)),step=[1,2,2.5,5,10].map(m=>m*mag).find(x=>x>=raw),top=step*3;
  const bw=(W-L-R)/Math.max(n,6),Y=v=>T+(1-v/top)*(H-T-B);

      if(n<=8||b.cur)g+=`<text x="${(x+w/2).toFixed(1)}" y="${(Y(b.v)-4).toFixed(1)}" text-anchor="middle" style="fill:#e8ecf0">${b.v>=10000?fmt(Math.round(b.v/100)/10,1)+'k':fmt(Math.round(b.v),0)}</text>`}

  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
}
/* semanas del plan con datos: kilos movidos y medias diarias de lo comido (solo días con comida apuntada) */
function weeklyStats(){
  const cw=Math.min(weekOf(todayISO()),52),from=Math.max(1,cw-11),out=[];
  for(let w=from;w<=cw;w++)out.push({w,vol:0,sets:0,n:0,k:0,p:0,f:0,cur:w===cw});
  const at=w=>out.find(o=>o.w===w);
  for(const [k,wo] of Object.entries(S.workouts)){if(k<START)continue;const o=at(weekOf(k));if(!o)continue;const sm=woSummary(wo);o.vol+=sm.vol;o.sets+=sm.n}
  for(const k of Object.keys(S.days)){if(k<START||k>todayISO())continue;const o=at(weekOf(k));if(!o)continue;const v=getDay(k);if(!hasLog(v))continue;const t=dayTotals(v);o.n++;o.k+=t.k;o.p+=t.p;o.f+=t.f}
  for(const o of out)if(o.n){o.k/=o.n;o.p/=o.n;o.f/=o.n}
  return out;
}

/* ===== fuerza por ejercicio (v1.18.0) =====

const FZK='recomp45-fuerza';
function strengthData(){
  const by={};
  for(const [k,wo] of Object.entries(S.workouts).sort()){
    for(const [id,sets] of Object.entries((wo&&wo.sets)||{})){
      const real=(sets||[]).filter(x=>x&&+x.r>0);if(!real.length)continue;

function strengthCard(){

  let pick=lsGet(FZK,{}),id=order.includes(pick.id)?pick.id:order[0],mode=pick.mode==='tot'?'tot':'max';
  const ex=ALL_EX.find(e=>e.id===id),secs=ex.u==='s',log=by[id],noKg=log.every(l=>l.sets.every(x=>!x.kg));

function weightSeries(){return Object.entries(S.days).filter(([k,v])=>v&&+v.weight>0).map(([k,v])=>({d:k,x:diffDays(START,k),y:+v.weight})).sort((a,b)=>a.x-b.x)}

    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);url=c.toDataURL('image/jpeg',q);if(url.length<680000)break;max*=.85;q-=.07}
  const sc=Math.min(1,320/Math.max(bmp.width,bmp.height)),t=document.createElement('canvas');t.width=Math.round(bmp.width*sc);t.height=Math.round(bmp.height*sc);
  t.getContext('2d').drawImage(bmp,0,0,t.width,t.height);
  return{full:url,th:t.toDataURL('image/jpeg',.7)};
}

/* temporizador de descanso */
/* Cuenta atrás del descanso; al llegar a 0 pita y sigue contando en rojo lo que te pasas.
   Arranca solo al apuntar las repeticiones de una serie (en superserie, al apuntar la del último ejercicio de la pareja). */
let tInt=null,T=null,actx=null,wlock=null;
function unlockAudio(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}catch(e){}}
document.addEventListener('touchend',unlockAudio,{passive:true});document.addEventListener('click',unlockAudio);
function beep(){try{unlockAudio();if(!actx)return;const t0=actx.currentTime;
  [0,.25,.5].forEach((dt,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.frequency.value=i===2?1320:880;o.type='square';
    g.gain.setValueAtTime(0,t0+dt);g.gain.linearRampToValueAtTime(.18,t0+dt+.01);g.gain.linearRampToValueAtTime(0,t0+dt+.18);
    o.connect(g).connect(actx.destination);o.start(t0+dt);o.stop(t0+dt+.2)})}catch(e){}
  try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(e){}}
async function keepAwake(on){try{if(on&&!wlock&&navigator.wakeLock)wlock=await navigator.wakeLock.request('screen');else if(!on&&wlock){await wlock.release();wlock=null}}catch(e){wlock=null}}
function stopTimer(){clearInterval(tInt);T=null;$('#timer').hidden=true;keepAwake(false)}
function startTimer(sec,name){
  clearInterval(tInt);T={end:Date.now()+sec*1000,total:sec,name,beeped:false};
  $('#timer').hidden=false;keepAwake(true);
  const tick=()=>{if(!T)return;const left=(T.end-Date.now())/1000,box=$('#timerbox');
    if(left>0){box.classList.remove('over');$('#timerlbl').textContent='Descanso · '+T.name;$('#timert').textContent=mmss(Math.ceil(left));
      $('#timerfill').style.width=Math.min(100,(1-left/T.total)*100)+'%'}
    else{if(!T.beeped){T.beeped=true;beep()}const over=-left;box.classList.add('over');
      $('#timerlbl').textContent='¡A por la serie!';$('#timert').textContent='+'+mmss(Math.floor(over));$('#timerfill').style.width='100%';
      if(over>300)stopTimer()}};
  tick();tInt=setInterval(tick,250);
}
$('#timerstop').onclick=stopTimer;
$('#timerplus').onclick=()=>{if(!T)return;if(T.end<Date.now()){T.end=Date.now();T.beeped=false}T.end+=30000;T.total+=30};
$('#timerminus').onclick=()=>{if(!T)return;T.end-=15000;T.total=Math.max(15,T.total-15)};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&T)keepAwake(true)});
/* al apuntar las repeticiones, arranca el descanso que toca */
function autoRest(exId){
  const SS=SESS[sessionFor(st.date)];if(!SS)return;const xi=SS.ex.findIndex(e=>e.id===exId);if(xi<0)return;
  const ex=SS.ex[xi],nxt=SS.ex[xi+1];if(ex.ss&&nxt&&nxt.ss&&nxt.ss[0]===ex.ss[0])return;   /* A1: sin descanso, pasa a A2 */
  if(ex.r)startTimer(ex.r,ex.n);
}

async function gErr(r){
  let msg='';try{const j=await r.json();msg=j.error&&j.error.message||''}catch(e){}
  if(r.status===400&&/API key/i.test(msg))return new Error('La clave de Gemini no es válida. Revísala en Ajustes.');
  if(r.status===403)return new Error('Esta clave no tiene permiso para usar Gemini.');
  if(r.status===429)return new Error('Has llegado al límite gratuito de Gemini por ahora. Prueba dentro de un rato.');
  if(r.status>=500)return new Error('Gemini está saturado. Prueba en un minuto.');
  return new Error('Error de Gemini'+(msg?': '+msg:'')+'.');
}
async function blobToB64(blob,max=1280){
  const bmp=await createImageBitmap(blob),sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
  const c=document.createElement('canvas');c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  const url=c.toDataURL('image/jpeg',.82);return{data:url.split(',')[1],mime:'image/jpeg',url};
}
/* fast: pide a Gemini que piense poco (lectura de etiquetas, desglose de comidas). Límite de 75 s para que nunca se quede colgado. */
async function gemini({system,contents,json=false,fast=false,timeout=75000}){
  if(!navigator.onLine)throw new Error('Sin conexión: la IA necesita internet.');
  const key=lsGet(GKEY,'');if(!key)throw new Error('Falta la clave de Gemini.');
  let model=lsGet(GMODEL,'');if(!model){model=await pickModel(key);lsSet(GMODEL,model)}
  const mk=(think)=>{const gc=json?{responseMimeType:'application/json',temperature:.2}:{temperature:.6};
    if(think){if(/gemini-2\.5/.test(model))gc.thinkingConfig={thinkingBudget:0};else if(/gemini-[3-9]/.test(model))gc.thinkingConfig={thinkingLevel:'low'}}
    const b={contents,generationConfig:gc};if(system)b.systemInstruction={parts:[{text:system}]};return JSON.stringify(b)};
  const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),timeout);
  const call=(think)=>fetch(GAPI+'models/'+model+':generateContent',{method:'POST',signal:ctl.signal,headers:{'Content-Type':'application/json','x-goog-api-key':key},body:mk(think)});
  let r;
  try{
    r=await call(fast);
    if(r.status===400&&fast)r=await call(false);   /* el modelo no admite el ajuste de pensamiento */
    if(r.status===404){lsSet(GMODEL,'');model=await pickModel(key);lsSet(GMODEL,model);r=await call(fast);if(r.status===400&&fast)r=await call(false)}
  }catch(e){if(e.name==='AbortError')throw new Error('La IA está tardando demasiado. Prueba otra vez en un momento.');throw new Error('No he podido conectar con la IA. Revisa la conexión y prueba otra vez.')}
  finally{clearTimeout(tm)}
  if(!r.ok)throw await gErr(r);
  const j=await r.json(),cand=j.candidates&&j.candidates[0];
  const text=(cand&&cand.content&&cand.content.parts||[]).map(p=>p.text||'').join('').trim();
  if(!text)throw new Error(cand&&cand.finishReason==='SAFETY'?'Gemini no ha querido responder a eso. Pregúntalo de otra forma.':'No ha llegado respuesta. Prueba otra vez.');
  if(!json)return text;
  try{return JSON.parse(text)}catch(e){const m=text.match(/[\[{][\s\S]*[\]}]/);if(m)return JSON.parse(m[0]);throw new Error('No he podido leer la respuesta. Prueba otra vez.')}
}

  L.push('Comidas del plan hoy: '+MEALS.map(m=>{const s=(day.meals||{})[m.id]||{},o=m.opts[s.opt||'A'],mm=optM(o);if(Array.isArray(s.items)){const x=mealM(m,s);return `${m.n} ${m.h} CAMBIADA: comió ${s.items.map(i=>i.n+' '+i.g+(i.ml?' ml':' g')).join(', ')} (${fmt(x.k)} kcal, P ${fmt(x.p)}) ${s.done?'COMIDA':'pendiente'}`}return `${m.n} ${m.h} opción ${s.opt||'A'} "${o.t}" (${fmt(mm.k)} kcal, P ${fmt(mm.p)}) ${s.done?'COMIDA':'pendiente'}`}).join('; ')+'.');
  if((day.extras||[]).length)L.push('Fuera de plan hoy: '+day.extras.map(x=>`${x.n} ${x.k} kcal`).join(', ')+'.');
  L.push(`Entreno de hoy: ${SESS[sessionFor(t)].n}.`);
  {const g=goals();L.push(`Objetivos del reloj: ${g.pasos} pasos, ${g.kcal} kcal activas y ${g.sueno} h de sueño al día.`)}
  L.push('ÚLTIMOS 14 DÍAS:');
  for(let i=13;i>=0;i--){const k=addDays(t,-i),v=S.days[k]&&getDay(k);if(!v)continue;const x=dayTotals(v),bits=[];
    if(hasLog(v))bits.push(`${fmt(x.k)} kcal P${fmt(x.p)}`);if(v.weight)bits.push(`peso ${v.weight}`);if(v.steps)bits.push(`${v.steps} pasos`);if(v.zepp&&v.zepp.kcal!=null)bits.push(`${v.zepp.kcal} kcal activas (reloj)`);if(v.sleep)bits.push(`sueño ${v.sleep} h`);if(v.water)bits.push(`agua ${v.water} L`);if(v.codos)bits.push('rutina codos');
    const wo=S.workouts[k];if(wo&&wo.sets)bits.push(`entreno ${SESS[wo.session]?SESS[wo.session].n:''}${wo.pain!=null?' dolor codo '+wo.pain+'/10':''}`);
    if(bits.length)L.push(`- ${k}: ${bits.join(', ')}`)}
  const ws=weeklyAvgs(weightSeries());if(ws.length)L.push('Peso medio por semana: '+ws.map(x=>`S${x.w} ${fmt(x.avg,1)} kg`).join(', ')+'.');
  const cis=Object.entries(S.checkins).sort().map(([k,v])=>`${k}: `+[v.peso?'peso '+v.peso+' kg':'',...MEDIDAS.map(m=>v[m.k]?m.t.toLowerCase()+' '+v[m.k]+' cm':''),v.pain!=null?'dolor codo '+v.pain+'/10':'',v.note?'nota "'+v.note+'"':''].filter(Boolean).join(', '));if(cis.length)L.push('Revisiones semanales: '+cis.join(' | ')+'.');
  const wks=Object.keys(S.workouts).sort().slice(-8);
  if(wks.length){L.push('ÚLTIMOS ENTRENOS:');for(const k of wks){const wo=S.workouts[k];if(!wo||!wo.sets)continue;

function md(s){
  const e=esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  const lines=e.split('\n');let out='',inList=false;
  for(const l of lines){if(/^\s*[-•*]\s+/.test(l)){if(!inList){out+='<ul>';inList=true}out+='<li>'+l.replace(/^\s*[-•*]\s+/,'')+'</li>'}else{if(inList){out+='</ul>';inList=false}out+=l?l+'<br>':''}}
  if(inList)out+='</ul>';return out.replace(/(<br>)+$/,'');
}

/* ===== acerca de y actualizaciones ===== */
const vcmp=(a,b)=>{const x=String(a).split('.').map(Number),y=String(b).split('.').map(Number);for(let i=0;i<3;i++){if((x[i]||0)!==(y[i]||0))return(x[i]||0)-(y[i]||0)}return 0};
let latest=null,updToastFor=null;
async function fetchLatest(){
  const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('http '+r.status);
  latest=await r.json();markUpdate();return latest;
}
function hasUpdate(){return !!(latest&&vcmp(latest.version,APP_VERSION)>0)}
function markUpdate(){const b=$('#btn-menu');if(b)b.classList.toggle('has-upd',hasUpdate());const mi=$('#mi-ver');if(mi)mi.textContent=hasUpdate()?`v${APP_VERSION} · nueva v${latest.version}`:`v${APP_VERSION}`}
async function checkUpdateSilent(){
  try{await fetchLatest();if(swReg)swReg.update().catch(()=>{})}catch(e){return}
  if(hasUpdate()&&!updToastFor){updToastFor=latest.version;toast(`Hay una versión nueva: v${latest.version}`,'',{label:'Actualizar',fn:applyUpdate})}
}
function openAbout(){
  openSheet('Acerca de','Recomp 45',`
    <div class="card"><div class="row between"><div><div class="eyebrow">Versión instalada</div><div class="big-title num">v${APP_VERSION}</div></div>
      <button type="button" class="btn" id="upd-check">Buscar actualizaciones</button></div>
      <div id="upd-res" aria-live="polite"></div></div>
    <div id="upd-notes"></div>
    <p class="small muted">Datos en tu Firebase, IA con tu clave de Gemini, app en GitHub Pages. Funciona sin conexión salvo la IA.</p>`);
  const run=async()=>{
    const res=$('#upd-res'),btn=$('#upd-check');if(!res)return;
    btn.disabled=true;res.innerHTML='<p class="small muted">Buscando…</p>';
    try{await fetchLatest();if(swReg)swReg.update().catch(()=>{})}
    catch(e){res.innerHTML='<p class="small" style="color:var(--bad)">No he podido comprobarlo. Revisa la conexión y vuelve a intentarlo.</p>';btn.disabled=false;return}
    btn.disabled=false;
    if(hasUpdate()){res.innerHTML=`<p class="small">Hay una versión nueva: <b class="num">v${esc(latest.version)}</b> (${esc(latest.fecha||'')}).</p><button type="button" class="btn pri" id="upd-go">Actualizar ahora</button>`;$('#upd-go').onclick=applyUpdate}
    else res.innerHTML=`<p class="small" style="color:var(--good)">✓ Tienes la última versión.</p>`;
    const hist=(latest.historial||[{version:latest.version,fecha:latest.fecha,notas:latest.notas}]).slice(0,4);
    $('#upd-notes').innerHTML=`<div class="card"><h2>Novedades</h2>${hist.map(x=>`<div><div class="eyebrow">v${esc(x.version)} · ${esc(x.fecha||'')}${vcmp(x.version,APP_VERSION)>0?' · <span style="color:var(--accent)">nueva</span>':''}</div><ul class="small" style="margin:4px 0 0;padding-left:1.2em;display:grid;gap:4px">${(x.notas||[]).map(n=>`<li>${esc(n)}</li>`).join('')}</ul></div>`).join('')}</div>`;
  };
  $('#upd-check').onclick=run;run();
}

/* ================== COPIA, RESTAURAR Y PDF ================== */
function downloadBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
function exportBackup(){
  const data={app:'recomp45',version:1,appVersion:APP_VERSION,exportado:new Date().toISOString(),datos:clone(S)};
  downloadBlob(new Blob([JSON.stringify(data,null,1)],{type:'application/json'}),`recomp45-copia-${todayISO()}.json`);
  toast(`Copia descargada: ${Object.keys(S.days).length} días, ${Object.keys(S.workouts).length} entrenos`);
}
$('#f-restore').onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  let j;try{j=JSON.parse(await f.text())}catch(err){toast('Ese archivo no es una copia válida.','err');return}
  const d=j&&j.app==='recomp45'&&j.datos;
  if(!d||!COLS.every(c=>typeof d[c]==='object')){toast('Ese archivo no es una copia de Recomp 45.','err');return}
  const n=COLS.reduce((a,c)=>a+Object.keys(d[c]).length,0);
  openSheet('Copia','Restaurar copia',`<p>Copia del <b>${esc((j.exportado||'').slice(0,10))}</b> con <b>${n}</b> registros: ${Object.keys(d.days).length} días, ${Object.keys(d.workouts).length} entrenos y ${Object.keys(d.checkins).length} revisiones.</p>
    <p class="note elbow">Los días que estén en la copia sustituyen a los mismos días de la app. Lo que no esté en la copia se queda como está.</p>
    <div class="row"><button type="button" class="btn pri" id="rs-go">Restaurar</button><button type="button" class="btn" id="rs-no">Cancelar</button></div>`);
  $('#rs-no').onclick=closeSheet;
  $('#rs-go').onclick=async()=>{
    $('#rs-go').disabled=true;let i=0;
    for(const c of COLS)for(const [id,doc] of Object.entries(d[c])){S[c][id]=doc;window.FB.db.set(path(c),id,doc);if(++i%40===0)await sleep(300)}
    closeSheet();render();toast(`Copia restaurada: ${n} registros`);
  };
};
function loadScript(src){return new Promise((ok,ko)=>{const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=ko;document.head.append(s)})}
async function exportPdf(){
  try{
    toast('Preparando el PDF…');
    if(!window.jspdf)await loadScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    const doc=new window.jspdf.jsPDF({unit:'mm',format:'a4'}),W=210,M=14;let y=M;
    const line=(txt,size=10,bold=false,color=[20,20,20])=>{doc.setFont('helvetica',bold?'bold':'normal');doc.setFontSize(size);doc.setTextColor(...color);
      for(const l of doc.splitTextToSize(String(txt),W-2*M)){if(y>285){doc.addPage();y=M}doc.text(l,M,y);y+=size*.45}};
    const gap=h=>{y+=h};
    doc.setFillColor(243,154,30);doc.rect(0,0,W,4,'F');
    const t=todayISO(),cw=Math.min(weekOf(t),12);
    line('Recomp 45 · Informe de progreso',18,true);gap(1);
    line(`Generado el ${new Date().toLocaleDateString('es-ES')} · Semana ${cw} de 12 (${phase(cw).n}) · Inicio ${shortDate(START)} ${START.slice(0,4)}`,9,false,[90,90,90]);gap(4);
    line('Punto de partida y objetivo',13,true);gap(1);
    {const w0=weightSeries()[0],c0=waistSeries()[0];line(`Hombre, 45 años, 175 cm. Inicio: ${w0?fmt(w0.y,1):BASE.peso} kg, ~${BASE.grasa}% grasa, cintura ${c0?fmt(c0.y,1):BASE.cintura} cm.`,10)}
    line(`Objetivo diario: ${TARGET.kcal} kcal · proteína ${TARGET.p} g · carbohidratos ${TARGET.c} g · grasas ${TARGET.f} g.`,10);gap(4);
    const ws=weightSeries(),wsr=waistSeries(),wa=weeklyAvgs(ws);
    if(ws.length){const last=ws[ws.length-1];line(`Peso: ${fmt(last.y,1)} kg (${fmt(last.y-ws[0].y,1)} kg desde el inicio)${wsr.length?` · Cintura: ${fmt(wsr[wsr.length-1].y,1)} cm (${fmt(wsr[wsr.length-1].y-wsr[0].y,1)} cm)`:''}`,11,true);gap(3)}
    line('Semana a semana',13,true);gap(2);
    const cols=[M,32,58,82,108,132,156,180],head=['Sem.','Peso','Cintura','Kcal','Prot.','Sueño','Pasos','Codo'];
    doc.setFont('helvetica','bold');doc.setFontSize(9);doc.setTextColor(90,90,90);head.forEach((h,i)=>doc.text(h,cols[i],y));y+=5;doc.setFont('helvetica','normal');doc.setTextColor(20,20,20);
    for(let w=1;w<=cw;w++){
      const days=[...Array(7)].map((_,i)=>addDays(START,(w-1)*7+i)),dd=days.map(k=>S.days[k]&&getDay(k)).filter(Boolean),lg=dd.filter(hasLog).map(dayTotals);
      const avg=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:null,wav=wa.find(x=>x.w===w),ci=days.map(k=>S.checkins[k]).filter(Boolean).pop()||{};
      const sl=avg(dd.map(v=>+v.sleep).filter(v=>v>0)),stp=avg(dd.map(v=>+v.steps).filter(v=>v>0));
      const pains=days.map(k=>S.workouts[k]&&S.workouts[k].pain).filter(v=>v!=null),pn=avg(pains);
      const row=[String(w),wav?fmt(wav.avg,1):'-',ci.waist?fmt(ci.waist,1):'-',lg.length?fmt(avg(lg.map(x=>x.k))):'-',lg.length?fmt(avg(lg.map(x=>x.p))):'-',sl?fmt(sl,1)+' h':'-',stp?fmt(stp):'-',pn!=null?fmt(pn,1)+'/10':(ci.pain!=null?ci.pain+'/10':'-')];
      if(y>285){doc.addPage();y=M}row.forEach((v,i)=>doc.text(v,cols[i],y));y+=5;
    }
    gap(4);line('Progreso de fuerza (mejor serie: primera vs última)',13,true);gap(1);
    let any=false;
    for(const ex of ALL_EX){
      const logs=Object.keys(S.workouts).sort().map(k=>({k,sets:((S.workouts[k].sets||{})[ex.id]||[]).filter(s=>s&&s.r&&s.kg)})).filter(x=>x.sets.length);
      if(!logs.length)continue;any=true;
      const best=x=>x.sets.reduce((a,s)=>(+s.kg>+a.kg||(+s.kg===+a.kg&&+s.r>+a.r))?s:a);
      const a=best(logs[0]),b=best(logs[logs.length-1]);
      line(`• ${ex.n}: ${a.kg} kg x ${a.r} (${shortDate(logs[0].k)})  ->  ${b.kg} kg x ${b.r} (${shortDate(logs[logs.length-1].k)})`,9);
    }
    if(!any)line('Todavía no hay entrenos registrados.',9);
    const notes=Object.entries(S.checkins).sort().filter(([k,v])=>v.note);
    if(notes.length){gap(4);line('Notas de las revisiones',13,true);gap(1);for(const [k,v] of notes)line(`${shortDate(k)}: ${v.note}`,9)}
    gap(4);line('Este informe resume los datos registrados en la app. No sustituye la valoración de tu médico.',8,false,[120,120,120]);
    doc.save(`recomp45-informe-${t}.pdf`);
  }catch(err){console.warn(err);toast('No se pudo generar el PDF. Comprueba la conexión la primera vez.','err')}
}

/* ================== ARRANQUE ================== */
function showGate(msg,{login=false,setup=false}={}){$('#gate').hidden=false;$('#app').hidden=true;$('#gate-msg').textContent=msg;$('#btn-login').hidden=!login;$('#gate-setup').hidden=!setup}
function showApp(){$('#gate').hidden=true;$('#app').hidden=false;readHash();render();markUpdate();setTimeout(checkUpdateSilent,2500)}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&!$('#app').hidden)checkUpdateSilent()});
$('#btn-login').onclick=async()=>{try{await window.FB.signIn()}catch(e){toast('No se pudo iniciar sesión ('+(e&&e.code||'error')+')','err')}};
function boot(){
  if(!window.FB.configured){showGate('Instalada, pero sin base de datos todavía.',{setup:true});return}
  showGate('Comprobando tu sesión…');
}
if(window.FB)boot();else window.addEventListener('fb-ready',boot,{once:true});
window.addEventListener('fb-user',e=>{
  const u=e.detail;
  if(!u){uid=null;unsubs.forEach(x=>{try{x()}catch(e){}});unsubs=[];showGate('Entra con tu cuenta de Google para ver tu plan.',{login:true});return}
  if(uid===u.uid)return;
  uid=u.uid;for(const c of COLS)S[c]={};firstLoad={};seeded=false;zeppIn=[];zeppKey=null;zeppFirst=true;zeppTouched=new Set();AJ={};applyMyFoods();
  showApp();startData();
});

/* actualizaciones (service worker) */
let swReg=null;
/* actualizar: si el service worker nuevo ya está listo, se activa; si no, se vacía la caché de la app y se recarga desde GitHub */
async function applyUpdate(){
  toast('Actualizando…');
  try{if(swReg){await swReg.update().catch(()=>{});if(swReg.waiting){swReg.waiting.postMessage('SKIP_WAITING');return}}}catch(e){}
  try{for(const k of await caches.keys())if(k.startsWith('recomp-v-'))await caches.delete(k)}catch(e){}
  location.replace(location.pathname+'?v='+encodeURIComponent((latest&&latest.version)||Date.now())+location.hash);
}
if(/[?&]v=/.test(location.search)&&!/[?&]zepp=/.test(location.search))history.replaceState(null,'',location.pathname+location.hash);
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').then(reg=>{
    swReg=reg;
    /* el único aviso es el de checkUpdateSilent, siempre con el número de versión */
    const offer=()=>{checkUpdateSilent()};
    if(reg.waiting&&navigator.serviceWorker.controller)offer();
    reg.addEventListener('updatefound',()=>{const nw=reg.installing;nw&&nw.addEventListener('statechange',()=>{if(nw.state==='installed'&&navigator.serviceWorker.controller)offer()})});
    setInterval(()=>reg.update().catch(()=>{}),30*60*1000);
  }).catch(()=>{});
  let reloaded=false;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!reloaded){reloaded=true;location.reload()}});
}
</script>
